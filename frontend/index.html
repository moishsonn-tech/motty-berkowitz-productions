    if(AUD.el.paused)AUD.el.play(); else AUD.el.pause(); },
  seekAudio:(el,ev)=>{ if(!AUD.el||AUD.projectId!==el.dataset.id||!AUD.duration||!ev)return;
    const rect=el.getBoundingClientRect(); const x=ev.clientX-rect.left;
    AUD.el.currentTime=Math.max(0,Math.min(1,x/rect.width))*AUD.duration; updateAudioProgress(); },
  markSplit:(el)=>{ if(!AUD.el||AUD.projectId!==el.dataset.id)return;
    const p=project(el.dataset.id); const sp=(p.songParts||[]).find(s=>s.id===el.dataset.part);
    if(sp){ sp.t=AUD.el.currentTime; render(); scheduleSave('projects',p); } },
  toggleSongPartCrew:(el)=>{
    const p=project(el.dataset.id); const sp=(p.songParts||[]).find(s=>s.id===el.dataset.part);
    if(!sp)return; sp.crew=sp.crew||[];
    const i=sp.crew.indexOf(el.dataset.cid);
    if(i>-1)sp.crew.splice(i,1); else sp.crew.push(el.dataset.cid);
    render(); scheduleSave('projects',p);
  },
  openModal:(el)=>{S.modal=el.dataset.modal;if(el.dataset.modal==='contact')S.contactModalProjectIds=[];render()},
  toggleContactModalProject:(el)=>{
    // No render() here on purpose: a full re-render would wipe the modal's other
    // uncontrolled inputs (name/role/rate/phone) the user may have already typed.
    const i=S.contactModalProjectIds.indexOf(el.dataset.id);
    if(i>-1)S.contactModalProjectIds.splice(i,1); else S.contactModalProjectIds.push(el.dataset.id);
    const active=S.contactModalProjectIds.includes(el.dataset.id);
    el.classList.toggle('active',active);
    el.innerHTML=(active?I.check:I.plus)+' '+esc(project(el.dataset.id).name);
  },
  importFromContacts:async()=>{
    try{
      const [c]=await navigator.contacts.select(['name','tel'],{multiple:false});
      if(!c)return;
      if(c.name&&c.name[0])document.getElementById('f-name').value=c.name[0];
      if(c.tel&&c.tel[0])document.getElementById('f-phone').value=c.tel[0];
    }catch(e){ showToast('Contact import cancelled or unavailable'); }
  },
  closeModal:()=>{S.modal=null;render()},
  newProject:()=>{S.modal='project';render()},
  saveLocation:async()=>{
    const v=id=>document.getElementById(id).value.trim();
    const draft={name:v('f-name')||'New Location',type:v('f-type'),address:v('f-addr'),website:v('f-website'),notes:v('f-notes')};
    const {data,error}=await sb.from('locations').insert(locationToRow(draft)).select().single();
    if(error){ showToast('Could not add location: '+error.message); return; }
    LOCATIONS.push(rowToLocation(data));
    S.modal=null;render();showToast('Location added');
  },
  saveContact:async()=>{
    const v=id=>document.getElementById(id).value.trim();
    const rateAmt=v('f-rate-amt');
    const rate=rateAmt?'$'+rateAmt+'/'+v('f-rate-unit'):'—';
    const draft={name:v('f-name')||'New Person',role:v('f-role')||'Crew',rate,phone:v('f-phone')||'—',avail:'available'};
    const {data,error}=await sb.from('contacts').insert(contactToRow(draft)).select().single();
    if(error){ showToast('Could not add person: '+error.message); return; }
    const c=rowToContact(data);
    CONTACTS.push(c);
    S.contactModalProjectIds.forEach(pid=>{const p=project(pid); if(p&&!p.crew.includes(c.id)){p.crew.push(c.id); scheduleSave('projects',p);}});
    S.modal=null;render();showToast('Person added to directory');
  },
  saveProject:async()=>{
    const v=id=>document.getElementById(id).value.trim();
    const cname=v('f-client'); const linked=CLIENTS.find(c=>c.name.toLowerCase()===cname.toLowerCase());
    const draft={name:v('f-name')||'Untitled Project',client:cname||'—',type:v('f-type'),stage:'inquiry',
      shootDate:v('f-date')||'',callTime:'9:00 AM',wrapTime:'5:00 PM',budget:v('f-budget')||'TBD',
      crew:[],locationIds:[],scenes:[],clientId:linked?linked.id:null,dueDate:v('f-due'),brief:v('f-brief'),priority:'normal'};
    if(document.getElementById('f-tmpl').checked) draft.tasks=tasksFromTemplate(draft.type,draft.shootDate);
    S.newProjectClientId=null;
    draft.invoice=defaultInvoice(draft); // every other project has one from creation — without this, it's
                                          // invisible to the dashboard's Financial Overview and invoice Next
                                          // Steps until someone happens to open its Financials tab first
    const {data,error}=await sb.from('projects').insert(projectToRow(draft)).select().single();
    if(error){ showToast('Could not create project: '+error.message); return; }
    if(!PROJECTS.some(x=>x.id===data.id)) PROJECTS.push(rowToProject(data));
    S.modal=null;S.projectId=data.id;S.view='project';S.tab='overview';render();showToast('Project created');
  },
  saveEvent:async()=>{
    const v=id=>document.getElementById(id).value.trim();
    const draft={projectId:v('f-eproj')||null,type:v('f-etype'),label:v('f-elabel')||'New Event',
      date:v('f-edate')||isoLocal(new Date()),callTime:v('f-ecall')||'TBD',wrapTime:v('f-ewrap')||'TBD',crew:[]};
    const {data,error}=await sb.from('extra_events').insert(eventToRow(draft)).select().single();
    if(error){ showToast('Could not add event: '+error.message); return; }
    EXTRA_EVENTS.push(rowToEvent(data));
    S.modal=null;render();showToast('Event added');
  },
  'send-magic-link':async()=>{
    const email=document.getElementById('signin-email').value.trim();
    if(!email)return;
    S.authError=null;
    try{
      const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.origin+window.location.pathname}});
      if(error)throw error;
      S.magicLinkSent=email;
    }catch(e){ S.authError=e.message; }
    render();
  },
  'signin-passkey':async()=>{
    S.authError=null;
    try{ const {error}=await sb.auth.signInWithPasskey(); if(error)throw error; }
    catch(e){ S.authError=e.message; render(); }
  },
  signout:async()=>{ await sb.auth.signOut(); },
  'register-passkey':async()=>{
    try{ const {error}=await sb.auth.registerPasskey(); if(error)throw error; showToast('Passkey registered on this device'); }
    catch(e){ showToast('Could not register passkey: '+e.message); }
  },
  'add-allowed-email':async()=>{
    const input=document.getElementById('new-user-email');
    const email=input.value.trim().toLowerCase();
    if(!email)return;
    try{
      const {error}=await sb.from('allowed_emails').insert({email,added_by:S.session.user.email});
      if(error)throw error;
      await loadAllowedEmails();
    }catch(e){ showToast('Could not add user: '+e.message); }
  },
  'remove-allowed-email':async(el)=>{
    const email=el.dataset.email;
    const isSelf=S.session && email.toLowerCase()===S.session.user.email.toLowerCase();
    if(!confirm(isSelf?'This removes YOUR OWN access. Continue?':`Remove ${email}'s access?`))return;
    try{
      const {error}=await sb.from('allowed_emails').delete().eq('email',email);
      if(error)throw error;
      await loadAllowedEmails();
    }catch(e){ showToast('Could not remove user: '+e.message); }
  },
};
Object.assign(ACTIONS,PM_ACTIONS);
document.addEventListener('click',e=>{
  const stop=e.target.closest('[data-stop]');
  const el=e.target.closest('[data-action]');
  if(stop && (!el || !stop.contains(el))) return;
  if(!el)return;
  const fn=ACTIONS[el.dataset.action]; if(fn)fn(el,e);
});
document.addEventListener('pointerdown',e=>{
  const m=e.target.closest('[data-action="dragMarker"]'); if(!m)return;
  e.stopPropagation(); e.preventDefault();
  const wave=document.getElementById('mb-wave'); if(!wave)return;
  const rect=wave.getBoundingClientRect();
  const p=project(m.dataset.id); const sp=p&&(p.songParts||[]).find(s=>s.id===m.dataset.part); if(!sp)return;
  let pct=null;
  const move=ev=>{
    const x=Math.min(rect.width,Math.max(0,ev.clientX-rect.left));
    pct=x/rect.width; m.style.left=(pct*100)+'%';
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    if(pct!=null && AUD.duration){ sp.t=pct*AUD.duration; render(); scheduleSave('projects',p); }
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.action==='liveSearch'){S[el.dataset.field]=el.value;render();
    const box=document.querySelector('[data-field="'+el.dataset.field+'"]'); if(box){box.focus();box.setSelectionRange(box.value.length,box.value.length)}
    return;}
  if(el.dataset.action==='editScene'){
    const p=project(el.dataset.id); const sc=findAnyScene(p,el.dataset.scene);
    sc[el.dataset.field]=el.dataset.field==='duration'?Number(el.value):el.value;
    if(el.dataset.field==='locId')render();
    scheduleSave('projects',p);
  }
  if(el.dataset.action==='editSongPart'){
    const p=project(el.dataset.id); const sp=(p.songParts||[]).find(s=>s.id===el.dataset.part);
    if(el.dataset.field==='locId'){ sp.locId=el.value; }
    else if(el.tagName==='SELECT'){ sp.label=el.value==='__custom'?'':el.value; }
    else { sp.label=el.value; }
    scheduleSave('projects',p);
  }
  if(el.dataset.action==='editInvoiceItem'){
    const p=project(el.dataset.id); const inv=getInvoice(p); const it=inv.items.find(i=>i.id===el.dataset.item);
    it[el.dataset.field]=el.dataset.field==='amount'?parseMoney(el.value):el.value;
    scheduleSave('projects',p);
  }
  if(el.dataset.action==='editNotesRich'){ const p=project(el.dataset.id); p[el.dataset.field||'notes']=el.innerHTML; scheduleSave('projects',p); }
  if(el.dataset.action==='editProject'){ const p=project(el.dataset.id); p[el.dataset.field]=el.value; scheduleSave('projects',p); }
  if(el.dataset.action==='editCrewPay'){ const p=project(el.dataset.id); crewPayFor(p,el.dataset.cid).amount=Number(el.value)||0; scheduleSave('projects',p); }
});
document.addEventListener('change',e=>{
  if(e.target.dataset.action==='editInvoiceItem')render();
  if(e.target.dataset.action==='loadAudioFile')handleAudioFile(e.target);
  if(e.target.dataset.action==='insertNoteImage')handleNoteImage(e.target);
  if(e.target.dataset.action==='editProject')render();
  if(e.target.dataset.action==='editScene'&&e.target.dataset.field==='duration')render();
  if(e.target.dataset.action==='editCrewPay')render();
  if(e.target.dataset.action==='editSongPart'&&(e.target.tagName==='SELECT'))render();
});

/* ── Opener: the logo reveals itself on first load each session ───────────── */
function showOpener(){
  if(sessionStorage.getItem('mb-opener-seen'))return;
  sessionStorage.setItem('mb-opener-seen','1');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const el=document.createElement('div');
  el.className='opener';
  el.innerHTML=`<div class="opener-inner">
    <span class="opener-mark-wrap"><img class="opener-mark" src="assets/mb-mark.png" alt="Motty Berkowitz"></span>
    <div class="opener-word"><div class="ow-name">motty berkowitz</div><div class="ow-tag">video production</div></div>
  </div>`;
  document.body.appendChild(el);
  let dismissed=false;
  const dismiss=()=>{
    if(dismissed)return; dismissed=true;
    el.classList.add('lift');
    el.addEventListener('animationend',()=>el.remove(),{once:true});
    setTimeout(()=>el.remove(),1200);
  };
  el.addEventListener('click',dismiss);
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Enter'||e.key==='Escape'){dismiss();document.removeEventListener('keydown',esc);}
  });
  setTimeout(dismiss,3000);
  const freeze=new URLSearchParams(location.search).get('freeze');
  if(freeze!=null){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.getAnimations({subtree:true}).forEach(a=>{a.pause();a.currentTime=Number(freeze);});
    }));
  }
}

function checkConflictsOnce(){
  if(sessionStorage.getItem('mb-conflicts-seen'))return;
  const conflicts=conflictsFor(allEvents());
  if(!conflicts.length)return;
  sessionStorage.setItem('mb-conflicts-seen','1');
  showToast(`${conflicts.length} scheduling conflict${conflicts.length===1?'':'s'} to resolve — check Schedule`);
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
showOpener();
render();
</script>
