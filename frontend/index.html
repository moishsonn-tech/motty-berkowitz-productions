<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motty Berkowitz Video Production</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ── Tokens ──────────────────────────────────────────────────────────────── */
:root{
  --accent:#E8A63C; --accent-dark:#BD7F1E; --accent-wash:rgba(232,166,60,.13); --accent-ink:#241A02;
  --bg:#FAFAF8; --surface:#FFFFFF; --surface-2:#F4F3EF;
  --sb-bg:#1A1814; --sb-ink:#EFEDE8; --sb-mut:#948F86; --sb-line:rgba(255,255,255,.08); --sb-active-ink:#241A02;
  --sidebar-bg:#FFFFFF; --sidebar-ink:#201E26; --sidebar-mut:#8B8894; --sidebar-line:rgba(32,30,38,.07);
  --ink:#201E26; --ink-2:#635F6C; --ink-3:#93909B; --ink-4:#D2CFD6;
  --line:#EBE8E2; --line-2:#F2F0EA;
  --good:#4CAA78; --good-wash:rgba(76,170,120,.11);
  --warn:#D2853F; --warn-wash:rgba(210,133,63,.11);
  --bad:#D2645F; --bad-wash:rgba(210,100,95,.11);
  --info:#5C82BD; --info-wash:rgba(92,130,189,.11);
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px;
  --sh-sm:0 1px 2px rgba(20,18,10,.04),0 1px 1px rgba(20,18,10,.03);
  --sh-md:0 6px 16px rgba(20,18,10,.08),0 2px 5px rgba(20,18,10,.05);
  --sh-lg:0 20px 40px rgba(20,18,10,.13),0 6px 12px rgba(20,18,10,.06);
  --sh-float:0 10px 22px rgba(20,18,10,.09),0 2px 6px rgba(20,18,10,.05);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sidebar-w:236px; --topbar-h:60px; --bottomnav-h:64px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17161C; --surface:#201F27; --surface-2:#26252E;
    --ink:#EEECE8; --ink-2:#B7B4BE; --ink-3:#87838F; --ink-4:#514E58;
    --line:#34323C; --line-2:#2A2932;
    --accent-wash:rgba(200,134,46,.18); --good-wash:rgba(76,170,120,.16);
    --warn-wash:rgba(210,133,63,.16); --bad-wash:rgba(210,100,95,.16); --info-wash:rgba(92,130,189,.16);
    --sidebar-bg:#201F27; --sidebar-ink:#EEECE8; --sidebar-mut:#87838F; --sidebar-line:rgba(255,255,255,.08);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-weight:800;letter-spacing:-.01em;text-wrap:balance}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:var(--accent-wash)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── Shell ───────────────────────────────────────────────────────────────── */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--sidebar-bg);color:var(--sidebar-ink);
  display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);
  margin:16px;padding:18px 14px;border-radius:var(--r-xl);box-shadow:var(--sh-float);
  border:1px solid var(--sidebar-line)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.brand svg,.brand-mark-img{width:auto;height:26px;flex:none;object-fit:contain}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--sidebar-mut);letter-spacing:.03em}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-md);
  color:var(--sidebar-mut);cursor:pointer;font-weight:600;font-size:13.5px;transition:background .15s,color .15s;
  border:none;background:none;text-align:left;width:100%}
.nav-item .ico{width:18px;height:18px;flex:none}
.nav-item:hover{background:var(--surface-2);color:var(--sidebar-ink)}
.nav-item.active{background:var(--accent);color:var(--sb-active-ink);box-shadow:0 3px 10px rgba(232,166,60,.32)}
.nav-group-label{font-size:10px;font-weight:700;color:var(--sidebar-mut);text-transform:uppercase;
  letter-spacing:.09em;padding:16px 12px 6px}
.sidebar-foot{border-top:1px solid var(--sidebar-line);padding-top:12px;margin-top:8px}
.sidebar-account{font-size:11.5px;color:var(--sidebar-mut);padding:8px 12px 6px;word-break:break-all}
.sidebar-version{font-size:10.5px;color:var(--sidebar-mut);padding:4px 12px}

.shell-main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;
  background:rgba(250,250,248,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
@media (prefers-color-scheme:dark){.topbar{background:rgba(23,22,28,.82)}}
.topbar-title{font-size:16px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px}
.hamburger .ico{width:22px;height:22px}
.search-box{position:relative;width:260px;flex:none}
.search-box input{width:100%;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:13px}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.content{flex:1;padding:24px;width:100%;padding-bottom:calc(24px + env(safe-area-inset-bottom))}

.bottomnav{display:none}
@media (min-width:1700px){.content{padding:28px 36px}.grid-cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}

/* ── Icons ───────────────────────────────────────────────────────────────── */
.ico{stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── Buttons / chips / inputs ───────────────────────────────────────────── */
.btn{padding:9px 16px;border-radius:var(--r-md);font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  transition:transform .15s,filter .15s,background .15s,box-shadow .2s}
.btn .ico{width:15px;height:15px}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(232,166,60,.32),0 1px 2px rgba(232,166,60,.2)}
.btn-primary:hover{filter:brightness(1.04);transform:translateY(-1px);
  box-shadow:0 6px 16px rgba(232,166,60,.4),0 2px 4px rgba(232,166,60,.24)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink);box-shadow:var(--sh-sm)}
.btn-ghost:hover{background:var(--surface-2);transform:translateY(-1px);box-shadow:var(--sh-md)}
.btn-subtle{background:var(--surface-2);color:var(--ink-2)}
.btn-subtle:hover{transform:translateY(-1px);box-shadow:var(--sh-sm)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:var(--r-sm)}
.iconbtn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:var(--sh-sm);
  transition:transform .15s,box-shadow .2s,background .15s}
.iconbtn .ico{width:16px;height:16px}
.iconbtn:hover{background:var(--surface-2);transform:translateY(-1px);box-shadow:var(--sh-md)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;font-size:12.5px;
  font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip:hover{background:var(--surface-2)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}

/* Viewfinder-style focus: small corner brackets instead of a plain outline, keyboard-focus only */
.inp,.sel,.txt,.btn,.iconbtn,.chip{position:relative}
.inp:focus-visible,.sel:focus-visible,.txt:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.chip:focus-visible{outline:none}
.inp:focus-visible::after,.sel:focus-visible::after,.txt:focus-visible::after,.btn:focus-visible::after,
.iconbtn:focus-visible::after,.chip:focus-visible::after{
  content:'';position:absolute;inset:-4px;pointer-events:none;border-radius:inherit;
  background:
    linear-gradient(var(--accent),var(--accent)) top left/9px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top left/2px 9px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top right/9px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top right/2px 9px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom left/9px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom left/2px 9px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/9px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/2px 9px no-repeat;
}

.field label{display:block;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px}
.inp,.sel,.txt{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:9px 12px;font-size:13.5px}
.inp:focus,.sel:focus,.txt:focus{outline:none;border-color:var(--accent)}
.txt{resize:vertical;min-height:64px;font-family:var(--font)}
.field{margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── Cards / layout helpers ─────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);
  padding:20px 22px;box-shadow:var(--sh-sm)}
.signin-wrap{flex:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.signin-card{width:100%;max-width:380px;text-align:center}
.signin-card .brand-mark-img{height:44px;margin-bottom:14px}
.signin-divider{color:var(--ink-3);font-size:12px;margin:16px 0;text-transform:uppercase;letter-spacing:.06em}
.ok-banner{background:var(--good-wash);color:var(--good);border-radius:var(--r-md);padding:12px 14px;font-size:13px;margin-bottom:14px}
.warn-banner{background:var(--bad-wash);color:var(--bad);border-radius:var(--r-md);padding:12px 14px;font-size:13px}
.stat-label{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.badge-good{background:var(--good-wash);color:var(--good)}
.badge-warn{background:var(--warn-wash);color:var(--warn)}
.badge-bad{background:var(--bad-wash);color:var(--bad)}
.badge-info{background:var(--info-wash);color:var(--info)}
.badge-neutral{background:var(--surface-2);color:var(--ink-2)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;flex:none;border:2px solid var(--surface)}
.avatar-stack{display:flex}
.avatar-stack .avatar{margin-left:-8px}
.avatar-stack .avatar:first-child{margin-left:0}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty .ico{width:34px;height:34px;margin:0 auto 10px;opacity:.5}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:23px}
.page-head p{color:var(--ink-2);font-size:13.5px;margin-top:3px}

.timecode{display:inline-flex;align-items:center;font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink);background:var(--surface-2);
  padding:3px 8px;border-radius:6px}

/* Sprocket-hole divider — a quiet nod to film stock, used sparingly under page headers */
.sprocket-divider{height:6px;margin-bottom:20px;opacity:.4;
  background-image:radial-gradient(circle,var(--ink-4) 1.4px,transparent 1.4px);
  background-size:13px 6px;background-repeat:repeat-x;background-position:left center}

/* ── Dashboard ───────────────────────────────────────────────────────────── */
.welcome-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.welcome-head svg,.welcome-head .brand-mark-img{width:auto;height:30px;flex:none;object-fit:contain}
.welcome-head h1{font-size:22px}
.welcome-head .wdate{color:var(--ink-3);font-size:12.5px;font-weight:600;margin-top:1px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-tile{cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat-tile:hover{transform:translateY(-3px);box-shadow:var(--sh-float)}
.stat-tile.flagship{grid-column:span 2;background:var(--accent-wash);border-color:rgba(200,134,46,.35)}
.stat-tile .val{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;margin:5px 0 2px}
.stat-tile.flagship .val{font-size:32px;color:var(--accent-dark)}
.stat-tile .sub{font-size:11.5px;color:var(--ink-3)}
.stat-tile.flag .val{color:var(--bad)}

.week-card{margin-bottom:14px}
.week-strip-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
  flex-wrap:wrap;gap:10px}
.week-legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink-3);font-weight:600}
.week-legend span{display:inline-flex;align-items:center;gap:5px}
.week-dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.week-dot.app{background:var(--accent)}
.week-dot.gcal{background:var(--info)}
.week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.week-day{border-radius:var(--r-md);padding:12px 6px;text-align:center;cursor:pointer;
  background:var(--surface-2);transition:transform .15s,box-shadow .15s;border:1px solid transparent}
.week-day:hover{transform:translateY(-2px);box-shadow:var(--sh-sm)}
.week-day.today{background:var(--accent-wash);border-color:rgba(232,166,60,.35)}
.week-day-name{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
.week-day.today .week-day-name{color:var(--accent-dark)}
.week-day-num{font-size:18px;font-weight:800;margin:4px 0 6px;font-variant-numeric:tabular-nums}
.week-day-jobs{display:flex;flex-direction:column;gap:3px;min-height:7px}
.week-day-job{font-size:10px;font-weight:700;padding:3px 5px;border-radius:5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;text-align:left}
.week-day-job.app{background:var(--accent-wash);color:var(--accent-dark)}
.week-day-job.gcal{background:var(--info-wash);color:var(--info)}
.week-day-more{font-size:9.5px;color:var(--ink-3);font-weight:600}
@media (max-width:900px){.week-day{padding:8px 3px}.week-day-num{font-size:15px}.week-strip{gap:5px}
  .week-day-job{font-size:8.5px;padding:2px 3px}}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-head h2{font-size:16px}
.step-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm);
  transition:transform .15s,box-shadow .15s}
.step-row:hover{transform:translateY(-2px);box-shadow:var(--sh-float)}
.step-row .step-ico{width:30px;height:30px;border-radius:50%;background:var(--accent-wash);flex:none;
  display:inline-flex;align-items:center;justify-content:center}
.step-row .ico{width:15px;height:15px;color:var(--accent-dark);flex:none}
.step-row .step-text{flex:1;font-size:13px;color:var(--ink-2)}
.step-row .step-text b{font-weight:700;color:var(--ink)}
.oproj-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm);
  transition:transform .15s,box-shadow .15s}
.oproj-row:hover{transform:translateY(-2px);box-shadow:var(--sh-float)}
.oproj-name{font-weight:700;font-size:13.5px}
.oproj-client{font-size:12px;color:var(--ink-3)}
.oproj-date{font-size:12px;color:var(--ink-2);width:110px;flex:none}
@media (max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr)}.stat-tile.flagship{grid-column:span 2}
  .oproj-date{width:auto}}

/* ── Kanban ──────────────────────────────────────────────────────────────── */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto}
.col{background:var(--surface-2);border-radius:var(--r-lg);padding:12px;min-width:250px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.col-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.col-count{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface);border-radius:999px;
  padding:2px 8px;border:1px solid var(--line)}
.col-body{display:flex;flex-direction:column;gap:10px;min-height:40px}
.pcard{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);padding:14px;cursor:pointer;
  box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-3px);box-shadow:var(--sh-float)}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.type-dot{width:8px;height:8px;border-radius:50%;flex:none}
.pcard-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:3px}
.pcard-client{font-size:12px;color:var(--ink-3);margin-bottom:11px}
.pcard-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard-date{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.pcard-date .ico{width:12px;height:12px}

/* ── Tabs ────────────────────────────────────────────────────────────────── */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabbar::-webkit-scrollbar{display:none}
.tab{padding:11px 15px;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-color:var(--accent)}

/* ── Project detail header ──────────────────────────────────────────────── */
.slate-strip{height:9px;border-radius:999px;overflow:hidden;background:
  repeating-linear-gradient(115deg,var(--ink) 0 10px,var(--surface) 10px 12px,var(--accent) 12px 24px,var(--surface) 24px 26px);
  opacity:.9;margin-bottom:16px}
.back-link{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-size:12.5px;font-weight:600;
  cursor:pointer;margin-bottom:12px;background:none;border:none}
.back-link .ico{width:14px;height:14px}
.back-link:hover{color:var(--ink)}
.proj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.proj-title{font-size:24px;margin-bottom:4px}
.proj-sub{color:var(--ink-2);font-size:13.5px}
.inline-edit{border:1px solid transparent;background:transparent;border-radius:var(--r-sm);
  transition:border-color .15s,background .15s;font-family:var(--font)}
.inline-edit:hover{border-color:var(--line)}
.inline-edit:focus{border-color:var(--accent);background:var(--surface);outline:none}
.proj-title-input{font-size:24px;font-weight:800;width:100%;padding:3px 6px;margin:-3px 0 2px -6px;color:var(--ink)}
.proj-sub-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--ink-2);font-size:13.5px}
.proj-sub-input,.proj-sub-select{padding:3px 6px;font-size:13.5px;color:var(--ink-2);cursor:text}
.proj-sub-select{cursor:pointer}
.stage-track{display:flex;gap:6px;margin-top:14px}
.stage-pip{flex:1;text-align:center;padding:7px 4px;border-radius:var(--r-sm);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);color:var(--ink-3);cursor:pointer;
  border:1px solid transparent}
.stage-pip.done{background:var(--good-wash);color:var(--good)}
.stage-pip.now{background:var(--accent);color:#fff}

/* ── Scenes / storyline ─────────────────────────────────────────────────── */
.scene-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;
  margin-bottom:12px}
.scene-body{flex:1;min-width:0}
.scene-body .field{margin-bottom:10px}
.scene-loc-select{max-width:280px}
.audio-panel{background:var(--sb-bg);color:var(--sb-ink);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:18px}
.audio-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.audio-title{font-weight:800;font-size:14.5px}
.audio-artist{color:var(--sb-mut);font-size:12px}
.wave{display:flex;align-items:flex-end;gap:2px;height:46px;position:relative;margin-bottom:6px;cursor:pointer}
.wave i{flex:1;background:rgba(200,134,46,.45);border-radius:2px;display:block;pointer-events:none}
.wave-progress{position:absolute;top:0;left:0;bottom:0;background:rgba(240,180,41,.16);pointer-events:none;border-radius:2px}
.wave-marker{position:absolute;top:-6px;height:58px;width:2px;background:var(--accent);cursor:ew-resize;z-index:2}
.wave-marker::before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:9px;height:9px;
  border-radius:50%;background:var(--accent)}
.wave-markers{display:flex;justify-content:space-between;font-size:10px;font-family:var(--mono);color:var(--sb-mut)}
.wave-markers span{display:flex;flex-direction:column;align-items:center;gap:2px}
.wave-markers b{color:var(--accent);font-weight:700}
.audio-controls{display:flex;align-items:center;gap:10px;margin-top:12px}
.audio-playbtn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#1A1814;border:none;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .12s}
.audio-playbtn:active{transform:scale(.92)}
.audio-playbtn .ico{width:15px;height:15px}
.audio-time{font-size:12px;color:var(--sb-mut)}
.audio-hint{font-size:11.5px;color:var(--sb-mut)}
.audio-loadbtn{margin-left:auto;cursor:pointer}
.scene-range{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--accent-dark);
  background:var(--accent-wash);padding:3px 8px;border-radius:6px;white-space:nowrap;flex:none}
.script-toggle{margin-bottom:16px}
.songpart-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;margin-bottom:16px}
.songpart-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.songpart-head .inp{font-weight:800;font-size:15px;flex:1;min-width:120px}
.songpart-range{font-family:var(--mono);font-size:11.5px;color:var(--accent-dark);background:var(--accent-wash);
  padding:4px 10px;border-radius:999px;font-weight:700;white-space:nowrap}
.subscene-card{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);
  padding:10px 12px;margin:8px 0 0 20px}
.subscene-card .field{margin-bottom:6px}
.notes-toolbar{display:flex;gap:8px;margin-bottom:10px}
.notes-rich{min-height:320px;overflow-y:auto;line-height:1.55}
.notes-rich img{max-width:100%;border-radius:var(--r-sm);margin:8px 0;display:block;
  resize:both;overflow:hidden;min-width:60px;min-height:40px}
.notes-rich ul{padding-left:22px;margin:8px 0}
.notes-rich:empty:before{content:attr(data-placeholder);color:var(--ink-3)}
.notes-rich:focus{outline:none}

/* ── Shot list ───────────────────────────────────────────────────────────── */
.shot-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.loc-group{margin-bottom:22px}
.loc-group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.loc-group-head .ico{width:15px;height:15px;color:var(--ink-3)}
.loc-group-head b{font-size:13.5px}
.loc-group-head span{color:var(--ink-3);font-size:12px}
.shot-row{display:grid;grid-template-columns:64px 100px 1fr 130px 150px;gap:14px;align-items:center;
  padding:11px 4px;border-bottom:1px solid var(--line-2)}
.shot-row:last-child{border-bottom:none}
.shot-code{font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--ink-2)}
.shot-desc{font-size:13px;color:var(--ink)}
.shot-equip{font-size:11.5px;color:var(--ink-3)}
.status-sel{font-size:11.5px;font-weight:700;padding:5px 8px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface)}

/* ── Directory grids (locations/contacts) ───────────────────────────────── */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.loc-card,.person-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--sh-sm);transition:box-shadow .15s,transform .15s}
.loc-card:hover,.person-card:hover{box-shadow:var(--sh-float);transform:translateY(-3px)}
.loc-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.loc-name{font-weight:700;font-size:14px;margin-bottom:2px}
.loc-addr{font-size:12px;color:var(--ink-3);display:flex;gap:4px;align-items:flex-start;margin-bottom:8px}
.loc-addr .ico{width:12px;height:12px;flex:none;margin-top:2px}
.loc-notes{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;
  margin-top:8px;line-height:1.5}
.loc-used{font-size:11px;color:var(--ink-3);margin-top:10px}
.loc-website{font-size:12px;color:var(--accent);text-decoration:none;display:block;margin-bottom:8px}
.loc-website:hover{text-decoration:underline}
.loc-photos{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}
.loc-photos img{width:84px;height:64px;object-fit:cover;border-radius:var(--r-sm);flex:none}
.loc-photo-placeholder{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);
  background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px}
.loc-photo-placeholder .ico{width:14px;height:14px}

.person-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.person-top .avatar{width:42px;height:42px;font-size:14px}
.person-name{font-weight:700;font-size:14px}
.person-role{font-size:12px;color:var(--ink-3)}
.person-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2);
  padding-top:10px;margin-top:10px;border-top:1px solid var(--line-2)}

/* ── Schedule ────────────────────────────────────────────────────────────── */
.conflict-banner{display:flex;gap:12px;align-items:flex-start;background:var(--bad-wash);color:var(--bad);
  border:1px solid rgba(194,59,59,.3);border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px}
.conflict-banner .ico{width:18px;height:18px;flex:none;margin-top:1px}
.conflict-banner b{display:block;margin-bottom:2px}
.day-group{margin-bottom:22px}
.day-label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:10px}
.event-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;
  display:flex;gap:16px;align-items:center;margin-bottom:10px;box-shadow:var(--sh-sm);cursor:pointer;
  transition:transform .15s,box-shadow .15s}
.event-card:hover{transform:translateY(-2px);box-shadow:var(--sh-float)}
.event-card.conflict{border-color:rgba(210,100,95,.4);box-shadow:0 0 0 1px rgba(210,100,95,.15)}
.event-date{width:52px;flex:none;text-align:center}
.event-date b{display:block;font-size:20px;line-height:1.1}
.event-date span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;font-weight:700}
.event-main{flex:1;min-width:0}
.event-title{font-weight:700;font-size:14px;margin-bottom:3px}
.event-sub{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.event-sub span{display:flex;gap:4px;align-items:center}
.event-sub .ico{width:12px;height:12px}

/* ── Calendar toolbar / month / week views ──────────────────────────────── */
.cal-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav-label{font-weight:800;font-size:15px;min-width:170px}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.month-dow{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-bottom:6px}
.month-cell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:8px;
  height:100px;overflow:hidden;cursor:pointer;transition:box-shadow .15s,transform .15s}
.month-cell:hover{box-shadow:var(--sh-sm);transform:translateY(-1px)}
.month-cell.out{opacity:.4}
.month-cell.today{border-color:var(--accent);background:var(--accent-wash)}
.month-cell-num{font-size:12.5px;font-weight:700;margin-bottom:5px}
.month-pill{font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;margin-bottom:3px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;background:var(--accent-wash);color:var(--accent-dark)}
.month-pill.conflict{background:var(--bad-wash);color:var(--bad)}
.month-more{font-size:10px;color:var(--ink-3);font-weight:600}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.week-col-head{text-align:center;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--line);cursor:pointer}
.week-col-head .dow{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--ink-3)}
.week-col-head .num{font-size:16px;font-weight:800;margin-top:2px}
.week-col.today .week-col-head .num{color:var(--accent-dark)}
.week-ev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 8px;
  margin-bottom:6px;font-size:11.5px;cursor:pointer;transition:box-shadow .15s}
.week-ev:hover{box-shadow:var(--sh-sm)}
.week-ev-title{font-weight:700;margin-bottom:2px}
.week-ev-time{color:var(--ink-3);font-size:10.5px}
.week-ev.conflict{border-color:rgba(210,100,95,.4)}
@media (max-width:900px){
  .month-cell{height:76px;padding:5px}
  .week-grid{grid-template-columns:1fr;gap:0}
  .week-col{border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
}

/* ── Call sheet ──────────────────────────────────────────────────────────── */
.callsheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cs-body{padding:22px 24px}
.cs-body h2{font-size:19px;margin-bottom:8px}
.cs-body h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:16px 0 8px}
.cs-crew-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.cs-kosher-row{display:flex;flex-direction:column;gap:1px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.cs-kosher-row:last-child{border-bottom:none}
.cs-kosher-row span{color:var(--ink-3);font-size:11.5px}
.cs-actions{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:var(--surface-2)}

/* ── Invoicing ───────────────────────────────────────────────────────────── */
.inv-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.inv-stat{padding:16px 18px}
.inv-stat .val{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.inv-stat .sub{font-size:11.5px;color:var(--ink-3);display:block;margin-top:2px}
.inv-item-row{display:grid;grid-template-columns:1fr 130px 32px;gap:10px;align-items:center;margin-bottom:8px}
.inv-item-row .inp{font-size:13px}
.inv-item-amt{text-align:right;font-family:var(--mono)}
.inv-remove{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-3)}
.inv-remove:hover{background:var(--bad-wash);color:var(--bad);border-color:transparent}
.inv-totals{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.inv-total-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.inv-total-row.grand{font-size:15px;font-weight:800;color:var(--ink);padding-top:6px;border-top:1px solid var(--line-2)}
.inv-total-row .mono{font-variant-numeric:tabular-nums}
.inv-pay-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line-2)}
.inv-pay-row:last-child{border-bottom:none}
.inv-pay-check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.inv-pay-check input{width:17px;height:17px;accent-color:var(--good)}
.owed-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;
  border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .15s}
.owed-row:hover{background:var(--surface-2)}
.owed-row:last-child{border-bottom:none}
.owed-name{font-weight:700;font-size:13.5px}
.owed-client{font-size:12px;color:var(--ink-3)}
.owed-amt{font-weight:800;font-size:14px}

/* ── Modal / bottom sheet ───────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(20,18,10,.45);display:flex;align-items:center;justify-content:center;
  z-index:200;padding:20px}
.modal{background:var(--surface);border-radius:var(--r-lg);padding:22px 24px;width:100%;max-width:480px;
  max-height:86vh;overflow-y:auto;box-shadow:var(--sh-lg)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-head h3{font-size:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sb-bg);color:var(--sb-ink);
  padding:12px 20px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--sh-lg);z-index:300;
  display:flex;align-items:center;gap:8px}
.toast .ico{width:15px;height:15px;color:var(--accent)}

/* Signature sign-off — a quick moment when something real gets marked done (paid, delivered) */
.signoff{position:fixed;bottom:24px;right:24px;z-index:400;display:flex;align-items:center;gap:10px;
  background:var(--sb-bg);color:var(--sb-ink);padding:12px 18px;border-radius:999px;box-shadow:var(--sh-lg);
  animation:signoff-in .3s ease both,signoff-out .3s ease 1.7s forwards}
.signoff img{height:20px;width:auto;display:block;
  clip-path:inset(0 100% 0 0);animation:mb-reveal .6s cubic-bezier(.65,0,.35,1) .1s forwards}
.signoff span{font-size:12.5px;font-weight:700;color:var(--accent);white-space:nowrap}
@keyframes signoff-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes signoff-out{to{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){
  .signoff img{animation:none;clip-path:none}
}

/* ── Opener ──────────────────────────────────────────────────────────────── */
.opener{position:fixed;inset:0;background:#1A1814;z-index:9999;display:flex;align-items:center;
  justify-content:center;cursor:pointer}
.opener.lift{animation:mb-lift .85s cubic-bezier(.76,0,.24,1) forwards}
.opener-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.opener-mark-wrap{position:relative;display:inline-flex;
  animation:mb-pulse .6s cubic-bezier(.34,1.56,.64,1) 1.6s both}
.opener-mark{width:280px;height:auto;display:block;
  clip-path:inset(0 100% 0 0);animation:mb-reveal 1.3s cubic-bezier(.65,0,.35,1) .2s forwards}
.opener-word{opacity:0;text-align:center;animation:mb-fadeup .6s ease 1.9s forwards}
.ow-name{font-family:var(--font);font-size:19px;font-weight:700;color:#F0B429;letter-spacing:-.01em}
.ow-tag{font-family:var(--font);font-size:10.5px;font-weight:600;color:#B8A87E;letter-spacing:.28em;margin-top:5px}
@keyframes mb-reveal{to{clip-path:inset(0 0 0 0)}}
@keyframes mb-pulse{
  0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(240,180,41,0))}
  40%{transform:scale(.95)}
  70%{transform:scale(1.06);filter:drop-shadow(0 0 20px rgba(240,180,41,.6))}
  100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(240,180,41,0))}
}
@keyframes mb-fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes mb-lift{to{transform:translateY(-100%)}}
@media (prefers-reduced-motion:reduce){
  .opener-mark{animation:none;clip-path:none}
  .opener-mark-wrap{animation:none}
  .opener-word{animation:none;opacity:1}
}

/* ── Project management (tasks, deliverables, clients, meetings, proposals) ── */
.muted{color:var(--ink-3)}
.muted-sm{font-size:12px;color:var(--ink-3)}
.step-ico{width:30px;height:30px;border-radius:50%;background:var(--accent-wash);color:var(--accent-dark);flex:none;
  display:inline-flex;align-items:center;justify-content:center}
.step-ico .ico{width:15px;height:15px}
.info-banner{display:flex;align-items:center;gap:10px;background:var(--info-wash);color:var(--info);border-radius:var(--r-md);
  padding:11px 14px;font-size:13px;margin-bottom:14px;flex-wrap:wrap}
.info-banner .ico{width:16px;height:16px;flex:none}
.info-banner span{flex:1;min-width:200px}
.info-banner a{font-weight:700}
.pm-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card.flush{padding:0;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.progress{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:1;min-width:60px}
.progress>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .3s}
.task-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-2)}
.task-row:last-child{border-bottom:none}
.task-row.done .task-title{text-decoration:line-through;color:var(--ink-3)}
.task-check{width:18px;height:18px;accent-color:var(--accent);flex:none;cursor:pointer}
.task-main{flex:1;min-width:0}
.task-title{width:100%;border:none;border-bottom:1px solid transparent;background:none;font-weight:600;font-size:13.5px;padding:2px 0}
.task-title:focus{outline:none;border-bottom-color:var(--accent)}
.task-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.task-proj{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-weight:700;color:var(--ink-2)}
.task-proj:hover{color:var(--accent-dark)}
.task-proj .type-dot{width:7px;height:7px}
.task-due,.task-pri,.task-who{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:5px 7px;font-size:12px;flex:none}
.task-due{width:136px}.task-due.overdue{color:var(--bad);border-color:var(--bad)}
.task-who{max-width:130px}
.iconbtn.sm{width:28px;height:28px}.iconbtn.sm .ico{width:13px;height:13px}
.group-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:20px 0 8px;display:flex;gap:8px;align-items:center}
.group-label.bad{color:var(--bad)}
.group-label .col-count{background:var(--surface-2)}
.quick-add{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.quick-add .inp{flex:1;min-width:180px}
.quick-add .sel{width:auto}
.quick-add-card{margin-bottom:6px}.quick-add-card .quick-add{margin:0}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar>.inp{max-width:300px}.toolbar>.sel{width:auto}
.tbl-wrap{overflow-x:auto;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700;
  padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}

const TABLE_MAP = {locations:{set:v=>LOCATIONS=v, rowToObj:rowToLocation},
  contacts:{set:v=>CONTACTS=v, rowToObj:rowToContact},

/* ── Realtime sync: reload a table on any change, everyone signed in stays in sync ──── */
function isEditingText(){
  const el=document.activeElement;
  return !!el && (el.isContentEditable || el.tagName==='INPUT' || el.tagName==='TEXTAREA');
}
async function loadTable(table){
  const {data,error} = await sb.from(table).select('*').order('created_at');
  if(!error) TABLE_MAP[table].set((data||[]).map(TABLE_MAP[table].rowToObj));
  if(!isEditingText()) render();
}
let syncChannels=[];
async function startSync(){
  if(syncChannels.length) return;

  checkAi(); loadGoogleStatus();
  Object.keys(TABLE_MAP).forEach(table=>{
    syncChannels.push(sb.channel(table+'-changes')
      .on('postgres_changes', {event:'*', schema:'public', table}, ()=>loadTable(table))
      .subscribe());
  });
}

// Debounced whole-row save — every project/location/contact/event mutation ends with a call
// to this instead of hand-instrumenting each field. ~800ms after the last change on a given
// record, one upsert fires; further edits to the same record just reset the timer.
const _saveTimers={};
function scheduleSave(table, row){
  const key=table+':'+row.id;
  clearTimeout(_saveTimers[key]);
  _saveTimers[key]=setTimeout(async()=>{
    const {error} = await sb.from(table).update(TO_ROW[table](row)).eq('id', row.id);
    if(error) showToast('Save failed: '+error.message);
  }, 800);
}

/* ── shot-list generation from storyline scenes ─────────────────────────── */
function shotTypesFor(text){
  const t=text.toLowerCase(); const types=[];
  if(/drone|aerial|overhead|pull-back/.test(t))types.push({t:'Drone',eq:'Drone + ND filters'});
  if(/close|hands|ring|detail|eyes/.test(t))types.push({t:'Close-Up',eq:'85mm prime'});
  if(/track|walk|dance|enter|follow/.test(t))types.push({t:'Tracking',eq:'Gimbal'});
  if(/wide|establish|crowd|venue|skyline|campus/.test(t)||!types.length)types.push({t:'Wide',eq:'24mm + slider'});
  types.push({t:'Medium',eq:'50mm'});
  const seen=new Set(); return types.filter(x=>seen.has(x.t)?false:seen.add(x.t));
}
function flatScenes(p){
  const out=[];
  const addScene=(sc,prefix)=>{
    out.push({...sc,pathHeading:prefix?prefix+' — '+sc.heading:sc.heading});
    (sc.subScenes||[]).forEach(sub=>out.push({...sub,pathHeading:(prefix?prefix+' — ':'')+sc.heading+' — '+sub.heading}));
  };
  if(p.scriptMode==='mv'){
    (p.songParts||[]).forEach(sp=>(sp.scenes||[]).forEach(sc=>addScene(sc,sp.label)));
  } else {
    (p.scenes||[]).forEach(sc=>addScene(sc));
  }
  return out;
}
function findScene(p,sceneId){
  if(p.scriptMode==='mv'){ for(const sp of (p.songParts||[])){ const sc=sp.scenes.find(s=>s.id===sceneId); if(sc)return sc; } return null; }
  return (p.scenes||[]).find(s=>s.id===sceneId)||null;
}
function findAnyScene(p,id){
  const scenes = p.scriptMode==='mv' ? (p.songParts||[]).flatMap(sp=>sp.scenes) : (p.scenes||[]);
  for(const sc of scenes){
    if(sc.id===id) return sc;
    const sub=(sc.subScenes||[]).find(su=>su.id===id); if(sub) return sub;
  }
  return null;
}
function regularSceneRanges(p){
  let t=0; return (p.scenes||[]).map(sc=>{const start=t;t+=(sc.duration||0);return {start,end:t}});
}
function shotsForProject(p){
  const rows=[];
  flatScenes(p).forEach((sc,i)=>{
    const types=shotTypesFor(sc.heading+' '+sc.desc);
    types.forEach((ty,j)=>{
      rows.push({code:`SC${i+1}-${String.fromCharCode(65+j)}`,type:ty.t,equip:ty.eq,desc:sc.pathHeading,
        locId:sc.locId,sceneId:sc.id,status:'Planned'});
    });
  });
  return rows;
}

/* ── invoicing ────────────────────────────────────────────────────────────── */
function parseMoney(s){return Number(String(s==null?'':s).replace(/[^0-9.\-]/g,''))||0}
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('en-US')}
function defaultInvoice(p){
  const items=p.crew.map(cid=>{const c=contact(cid);const rate=parseMoney(c.rate);
    return rate?{id:'ci-'+c.id,desc:c.role+' ('+c.name+')',amount:rate,category:'other'}:null}).filter(Boolean);
  const crewSum=items.reduce((s,i)=>s+i.amount,0);
  const budgetNum=parseMoney(p.budget);
  const fee=Math.max(budgetNum-crewSum, budgetNum?Math.round(budgetNum*0.3):500);
  items.unshift({id:'ci-fee',desc:p.type+' Package — Creative & Production Fee',amount:fee,category:'motty'});
  return {number:'INV-'+(1044+PROJECTS.length),status:'draft',issueDate:new Date().toISOString().slice(0,10),
    dueDate:p.shootDate,depositPct:50,depositPaid:false,balancePaid:false,items};
}
function getInvoice(p){ if(!p.invoice) p.invoice=defaultInvoice(p); return p.invoice; }
function crewPayFor(p,cid){
  p.crewPay=p.crewPay||{};
  if(!p.crewPay[cid]){ const c=contact(cid); p.crewPay[cid]={amount:c?parseMoney(c.rate):0,paid:false}; }
  return p.crewPay[cid];
}
function invoiceTotal(inv){ return inv.items.reduce((s,i)=>s+i.amount,0); }
function invoicePaidToDate(inv){
  const total=invoiceTotal(inv);
  if(inv.balancePaid) return total;
  if(inv.depositPaid) return Math.round(total*inv.depositPct/100);
  return 0;
}
function invoiceStatusLabel(inv){
  if(inv.balancePaid) return 'Paid';
  if(inv.status==='sent') return 'Sent';
  return 'Draft';
}
function invoiceStatusBadge(inv){
  const label=invoiceStatusLabel(inv);
  return {Paid:'badge-good',Sent:'badge-warn',Draft:'badge-neutral'}[label];
}

function allEvents(){
  const evs = PROJECTS.filter(p=>p.shootDate).map(p=>({id:'shoot-'+p.id,projectId:p.id,label:'Shoot Day',date:p.shootDate,
    callTime:p.callTime,wrapTime:p.wrapTime,crew:p.crew}));
  return evs.concat(EXTRA_EVENTS).sort((a,b)=>a.date.localeCompare(b.date));
}
function conflictsFor(events){
  const byDate={};
  events.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e)});
  const conflicts=[];
  Object.values(byDate).forEach(list=>{
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const shared=list[i].crew.filter(c=>list[j].crew.includes(c));
      if(shared.length) conflicts.push({a:list[i],b:list[j],people:shared});
    }
  });
  return conflicts;
}

/* ── Audio player (real playback + real waveform, session-only — no upload/storage yet) ──── */
const AUD = {projectId:null, el:null, url:null, duration:0, peaks:[]};
function fmtTime(s){ if(!isFinite(s)||s<0)s=0; const m=Math.floor(s/60); const sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); }
function computePeaks(buf,n){
  const data=buf.getChannelData(0), step=Math.floor(data.length/n)||1, peaks=[];
  for(let i=0;i<n;i++){
    let max=0; const start=i*step, end=Math.min(data.length,start+step);
    for(let j=start;j<end;j++){ const v=Math.abs(data[j]); if(v>max)max=v; }
    peaks.push(Math.max(4,Math.round(max*46)));
  }
  return peaks;
}
function updateAudioProgress(){
  const fill=document.getElementById('mb-progress'), time=document.getElementById('mb-time');
  if(fill && AUD.el.duration) fill.style.width=(AUD.el.currentTime/AUD.el.duration*100)+'%';
  if(time) time.textContent = fmtTime(AUD.el.currentTime)+' / '+fmtTime(AUD.el.duration||0);
}
function downscaleImageFile(file,maxDim){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        let {width,height}=img;
        if(width>maxDim||height>maxDim){ const scale=maxDim/Math.max(width,height); width=Math.round(width*scale); height=Math.round(height*scale); }
        const canvas=document.createElement('canvas'); canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg',0.85));
      };
      img.onerror=reject;
      img.src=reader.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function handleNoteImage(input){
  const file=input.files[0]; if(!file)return;
  const pid=input.dataset.id; const field=input.dataset.field||'notes';
  const dataUrl=await downscaleImageFile(file,1000);
  const ed=document.getElementById(field+'-editor-'+pid);
  if(ed){ ed.focus(); document.execCommand('insertImage',false,dataUrl); const p=project(pid); p[field]=ed.innerHTML; scheduleSave('projects',p); }
}
async function handleAudioFile(input){
  const file=input.files[0]; if(!file)return;
  const pid=input.dataset.id;
  if(AUD.url) URL.revokeObjectURL(AUD.url);
  if(!AUD.el){
    AUD.el=new Audio();
    AUD.el.addEventListener('timeupdate',updateAudioProgress);
    AUD.el.addEventListener('play',render);
    AUD.el.addEventListener('pause',render);
    AUD.el.addEventListener('ended',render);
  }
  AUD.el.pause();
  AUD.projectId=pid; AUD.duration=0; AUD.peaks=[];
  AUD.url=URL.createObjectURL(file);
  AUD.el.src=AUD.url;
  AUD.el.addEventListener('loadedmetadata',function onMeta(){
    AUD.duration=AUD.el.duration||0;
    AUD.el.removeEventListener('loadedmetadata',onMeta);
    render();
  });
  showToast('Loading audio…');
  try{
    const arrBuf=await file.arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const audioBuf=await ctx.decodeAudioData(arrBuf);
    AUD.peaks=computePeaks(audioBuf,60);
    ctx.close();
  }catch(err){ AUD.peaks=[]; }
  render();
}
function songPartRange(parts,i,duration){
  const start = parts[i].t!=null ? parts[i].t : 0;
  const end = (i<parts.length-1 && parts[i+1].t!=null) ? parts[i+1].t : duration;
  return {start,end};
}
function audioPanel(p){
  const loaded = AUD.projectId===p.id && AUD.duration>0;
  const bars = loaded && AUD.peaks.length ? AUD.peaks
    : Array.from({length:60},(_,i)=>6+Math.round(20*Math.abs(Math.sin(i*0.4))+Math.random()*10));
  const parts = p.songParts||[];
  return `<div class="audio-panel">
    <div class="audio-head">
      <div><div class="audio-title">🎵 ${esc(p.audioTrack.title)}</div><div class="audio-artist">${esc(p.audioTrack.artist)} · ${esc(p.audioTrack.duration)}</div></div>
      <span class="badge badge-info">${loaded?'Audio loaded':'Audio synced to script'}</span>
    </div>
    <div class="wave" id="mb-wave" data-action="seekAudio" data-id="${p.id}">
      ${bars.map(h=>`<i style="height:${h}px"></i>`).join('')}
      ${loaded?`<div class="wave-progress" id="mb-progress" style="width:${AUD.el.duration?AUD.el.currentTime/AUD.el.duration*100:0}%"></div>`:''}
      ${loaded?parts.map((sp,i)=>{
        const pct = sp.t!=null ? Math.max(0,Math.min(100,sp.t/AUD.duration*100)) : (i/(parts.length-1||1)*100);
        return `<div class="wave-marker" style="left:${pct}%" data-action="dragMarker" data-id="${p.id}" data-part="${sp.id}" title="${esc(sp.label)}"></div>`;
      }).join(''):''}
    </div>
    <div class="wave-markers">${parts.map((sp,i)=>{
      const label = loaded ? (()=>{const r=songPartRange(parts,i,AUD.duration);return fmtTime(r.start)+'–'+fmtTime(r.end)})()
        : (sp.t!=null?fmtTime(sp.t):Math.round(i/(parts.length-1||1)*100)+'%');
      return `<span><b>${esc(sp.label)}</b>${label}</span>`;
    }).join('')}</div>
    <div class="audio-controls">
      ${loaded?`<button class="audio-playbtn" data-action="toggleAudioPlay" data-id="${p.id}">${AUD.el.paused?I.play:I.pause}</button>
        <span class="mono audio-time" id="mb-time">${fmtTime(AUD.el.currentTime)} / ${fmtTime(AUD.duration)}</span>`
        :`<span class="audio-hint">Pick a local audio file to play &amp; mark real split points — session only, no upload yet</span>`}
      <label class="btn btn-sm btn-subtle audio-loadbtn">${I.plus} ${loaded?'Replace':'Load'} Audio File
        <input type="file" accept="audio/*" style="display:none" data-action="loadAudioFile" data-id="${p.id}"></label>
    </div>
  </div>`;
}

/* ── Dashboard ────────────────────────────────────────────────────────── */
function nextSteps(){
  const steps=[];
  PROJECTS.forEach(p=>{
    if(p.stage==='delivered'||p.archived)return;
    if(!p.shootDate){
      steps.push({icon:I.calendar,text:`<b>${esc(p.name)}</b> has no confirmed shoot date — confirm date with ${esc(p.client)}`,id:p.id,sort:Infinity});
      return;
    }
    const days=daysUntil(p.shootDate);
    if(p.stage==='inquiry'){
      steps.push({icon:I.mail,text:`<b>${esc(p.name)}</b> is still in Inquiry — follow up with ${esc(p.client)}`,id:p.id,sort:days});
      return;
    }
    if(days>=0 && days<=14){
      steps.push({icon:I.calendar,text:`<b>${esc(p.name)}</b> shoots in ${days} day${days===1?'':'s'} — confirm the call sheet`,id:p.id,tab:'callsheet',sort:days});
    }
    if(p.stage==='pre' && p.crew.length===0){
      steps.push({icon:I.users,text:`<b>${esc(p.name)}</b> has no crew assigned yet`,id:p.id,tab:'crew',sort:days});
    }
    if(p.stage==='pre' && (p.type==='Music Video'||p.type==='Wedding') && flatScenes(p).length===0){
      steps.push({icon:I.film,text:`<b>${esc(p.name)}</b> needs its storyline built to generate a shot list`,id:p.id,tab:'storyline',sort:days});
    }
    if(p.invoice){
      const inv=p.invoice, outstanding=invoiceTotal(inv)-invoicePaidToDate(inv);
      if(invoiceStatusLabel(inv)==='Draft'){
        steps.push({icon:I.invoice,text:`<b>${esc(p.name)}</b> — invoice needs to be sent`,id:p.id,tab:'financials',sort:days});
      } else if((p.stage==='pre'||p.stage==='post') && outstanding>0){
        steps.push({icon:I.invoice,text:`<b>${esc(p.name)}</b> has an outstanding balance of ${fmtMoney(outstanding)}`,id:p.id,tab:'financials',sort:days});
      }
    }
  });
  return steps.sort((a,b)=>a.sort-b.sort);
}
function owedBreakdown(){
  const payoutRows=[],otherRows=[];
  PROJECTS.filter(p=>p.invoice).forEach(p=>{
    const inv=getInvoice(p), owed=invoiceTotal(inv)-invoicePaidToDate(inv);
    if(owed<=0)return;
    const row={id:p.id,name:p.name,client:p.client,owed};
    (p.stage==='delivered'?payoutRows:otherRows).push(row);
  });
  return {payoutRows,otherRows};
}
function financialSummary(){
  const withInv=PROJECTS.filter(p=>p.invoice);
  const thisYear=new Date().getFullYear();
  let invoiced=0,collectedThisYear=0;
  withInv.forEach(p=>{
    const inv=getInvoice(p); invoiced+=invoiceTotal(inv);
    if(p.shootDate && new Date(p.shootDate+'T00:00:00').getFullYear()===thisYear) collectedThisYear+=invoicePaidToDate(inv);
  });
  const {payoutRows,otherRows}=owedBreakdown();
  const payoutDue=payoutRows.reduce((s,r)=>s+r.owed,0);
  const otherOwed=otherRows.reduce((s,r)=>s+r.owed,0);
  return `
  <div class="section-head"><h2>Financial Overview</h2>
    <button class="btn btn-sm btn-ghost" data-action="syncQuickbooks">${I.sync} Sync to QuickBooks</button></div>
  <div class="inv-summary">
    <div class="card inv-stat" style="cursor:pointer" data-action="openModal" data-modal="payoutOwed">
      <span class="stat-label">Awaiting Payout</span>
      <span class="val" style="color:${payoutDue>0?'var(--bad)':'var(--ink)'}">${fmtMoney(payoutDue)}</span>
      <span class="sub">Finalized projects, balance still owed${payoutRows.length?' — click to see who':''}</span></div>
    <div class="card inv-stat" style="cursor:pointer" data-action="openModal" data-modal="otherOwed">
      <span class="stat-label">Other Money Owed</span>
      <span class="val" style="color:${otherOwed>0?'var(--warn)':'var(--ink)'}">${fmtMoney(otherOwed)}</span>
      <span class="sub">Active projects, not yet collected${otherRows.length?' — click to see who':''}</span></div>
    <div class="card inv-stat"><span class="stat-label">Collected This Year</span>
      <span class="val" style="color:var(--good)">${fmtMoney(collectedThisYear)}</span>
      <span class="sub">of ${fmtMoney(invoiced)} invoiced</span></div>
  </div>`;
}
function viewDashboard(){

  const steps=nextSteps();
  const today=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
  return `
  <div class="welcome-head">${logoMark}
    <div><h1>Welcome back</h1><div class="wdate">${today}</div></div></div>
  <div class="sprocket-divider"></div>

    return `<div class="oproj-row" data-action="openProject" data-id="${p.id}">

function mvScriptBody(p){
  const parts=p.songParts||[];
  return parts.length?parts.map((sp,i)=>songPartCard(p,sp,i)).join('')
    :`<div class="empty">${I.film}<div>No song parts yet — add one to start structuring the video.</div></div>`;
}
function regularScriptBody(p){
  const scenes=p.scenes||[];
  if(!scenes.length)return `<div class="empty">${I.film}<div>No scenes yet — build the script to auto-generate a shot list.</div></div>`;
  const ranges=regularSceneRanges(p);
  return scenes.map((sc,i)=>sceneCard(p,sc,i,{range:ranges[i]})).join('');
}

function tabShotlist(p){

  const usedLocIds=[...new Set(shotsForProject(p).map(s=>s.locId))];
  const groups={}; const order=[];
  shots.forEach(s=>{ if(!groups[s.sceneId]){groups[s.sceneId]=[];order.push(s.sceneId);} groups[s.sceneId].push(s); });
  return `
  <div class="shot-toolbar">
    <div class="chip-row" style="flex:1">
      <span class="chip ${S.shotLoc==='all'?'active':''}" data-action="shotLocFilter" data-loc="all">All locations</span>

  const availRoles=['all',...new Set(availAll.map(c=>c.role))];
  const avail=availAll.filter(c=>S.crewAddRole==='all'||c.role===S.crewAddRole);
  const total=crewIds.reduce((s,cid)=>s+crewPayFor(p,cid).amount,0);
  const paid=crewIds.reduce((s,cid)=>{const cp=crewPayFor(p,cid);return s+(cp.paid?cp.amount:0)},0);
  return `
  ${crewIds.length?`<div class="inv-summary" style="margin-bottom:16px">
    <div class="card inv-stat"><span class="stat-label">Total Crew Pay</span><span class="val">${fmtMoney(total)}</span></div>
    <div class="card inv-stat"><span class="stat-label">Paid Out</span><span class="val" style="color:var(--good)">${fmtMoney(paid)}</span></div>

/* ── Location photos: best-effort, keyless-safe (stub route until a Google key is added) ── */
function locPhotoStripHTML(locId){
  const photos=S.locPhotoCache[locId];
  if(photos===undefined){ fetchLocationPhotos(locId); return `<div class="loc-photo-placeholder">${I.image} Loading photos…</div>`; }
  if(photos===null) return `<div class="loc-photo-placeholder">${I.image} Loading photos…</div>`;
  if(!photos.length) return `<div class="loc-photo-placeholder">${I.image} No photos yet</div>`;
  return photos.map(url=>`<img src="${esc(url)}" alt="" loading="lazy">`).join('');
}
async function fetchLocationPhotos(locId){
  const l=getLoc(locId); if(!l)return;
  S.locPhotoCache[locId]=null; // in-flight guard, distinct from `undefined` (not-yet-requested)
  try{
    const res=await fetch('/api/location-photo?address='+encodeURIComponent(l.address));
    const data=res.ok?await res.json():{photos:[]};
    S.locPhotoCache[locId]=data.photos||[];
  }catch(e){ S.locPhotoCache[locId]=[]; }
  render();
}

function calRefDate(){return new Date(S.calDate+'T00:00:00')}
function startOfWeek(d){const r=new Date(d);r.setDate(r.getDate()-r.getDay());r.setHours(0,0,0,0);return r}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1)}
function calRangeLabel(){
  const ref=calRefDate();
  if(S.calView==='day')return ref.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  if(S.calView==='week'){
    const s=startOfWeek(ref),e=new Date(s);e.setDate(s.getDate()+6);
    return s.getMonth()===e.getMonth()
      ? `${s.toLocaleDateString('en-US',{month:'short'})} ${s.getDate()}–${e.getDate()}, ${e.getFullYear()}`
      : `${s.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${e.toLocaleDateString('en-US',{month:'short',day:'numeric'})}, ${e.getFullYear()}`;
  }
  return ref.toLocaleDateString('en-US',{month:'long',year:'numeric'});
}
function calToolbar(){
  return `<div class="cal-toolbar">
    <div class="cal-nav">
      <button class="iconbtn" data-action="calNav" data-dir="-1">${I.back}</button>
      <button class="btn btn-sm btn-ghost" data-action="calToday">Today</button>
      <button class="iconbtn" data-action="calNav" data-dir="1">${I.chevR}</button>
      <span class="cal-nav-label">${esc(calRangeLabel())}</span>
    </div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <div class="chip-row" style="flex:none">
        ${['day','week','month'].map(v=>`<span class="chip ${S.calView===v?'active':''}" data-action="calSetView" data-view="${v}">${v[0].toUpperCase()+v.slice(1)}</span>`).join('')}
      </div>
      <button class="btn btn-sm btn-ghost" data-action="openMeeting">${I.video} Schedule meeting</button>
      <button class="btn btn-sm btn-primary" data-action="openModal" data-modal="event">${I.plus} Add Event</button>
    </div>
  </div>`;
}
function monthView(events,conflictEventIds){
  const ref=calRefDate(); const gridStart=startOfWeek(startOfMonth(ref));
  const todayIso=isoLocal(new Date());
  const cells=Array.from({length:42},(_,i)=>{const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);return d});
  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return `<div class="month-grid">
    ${dows.map(d=>`<div class="month-dow">${d}</div>`).join('')}
    ${cells.map(d=>{
      const iso=isoLocal(d); const dayEvents=events.filter(e=>e.date===iso);
      const out=d.getMonth()!==ref.getMonth(), isToday=iso===todayIso, shown=dayEvents.slice(0,3);
      return `<div class="month-cell ${out?'out':''} ${isToday?'today':''}" data-action="calGoDay" data-date="${iso}">
        <div class="month-cell-num">${d.getDate()}</div>
        ${shown.map(e=>`<div class="month-pill ${conflictEventIds.has(e.id)?'conflict':''}" ${project(e.projectId)?`data-action="openProject" data-id="${e.projectId}"`:''} title="${esc(eventTitle(e))}">${esc(eventTitle(e))}</div>`).join('')}
        ${dayEvents.length>3?`<div class="month-more">+${dayEvents.length-3} more</div>`:''}
      </div>`;
    }).join('')}
  </div>`;
}
function weekView(events,conflictEventIds){
  const start=startOfWeek(calRefDate()); const todayIso=isoLocal(new Date());
  const days=Array.from({length:7},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});
  return `<div class="week-grid">
    ${days.map(d=>{
      const iso=isoLocal(d), isToday=iso===todayIso, dayEvents=events.filter(e=>e.date===iso);
      return `<div class="week-col ${isToday?'today':''}">
        <div class="week-col-head" data-action="calGoDay" data-date="${iso}">
          <div class="dow">${d.toLocaleDateString('en-US',{weekday:'short'})}</div>
          <div class="num">${d.getDate()}</div>
        </div>
        ${dayEvents.map(e=>`<div class="week-ev ${conflictEventIds.has(e.id)?'conflict':''}" ${project(e.projectId)?`data-action="openProject" data-id="${e.projectId}"`:''}>
          <div class="week-ev-title">${esc(eventTitle(e))}</div>
          <div class="week-ev-time mono">${esc(e.callTime)}–${esc(e.wrapTime)}</div>
        </div>`).join('')}
      </div>`;
    }).join('')}
  </div>`;
}
function dayView(events,conflictEventIds){
  const dayEvents=events.filter(e=>e.date===S.calDate);
  return dayEvents.length?dayEvents.map(e=>eventCardHTML(e,conflictEventIds)).join('')
    :`<div class="empty">${I.calendar}<div>No shoots or events scheduled this day.</div></div>`;
}
function viewSchedule(){
  const appEvents=allEvents(); const conflicts=conflictsFor(appEvents);
  const conflictEventIds=new Set(); conflicts.forEach(c=>{conflictEventIds.add(c.a.id);conflictEventIds.add(c.b.id)});
  const events=appEvents.concat(GCAL_EVENTS.map(g=>({id:'g-'+g.id,projectId:null,type:'Google Calendar',label:g.title,date:g.date,
    callTime:g.allDay?'All day':new Date(g.start).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}),wrapTime:'',crew:[],meetingLink:g.link}))).sort((a,b)=>a.date.localeCompare(b.date));
  const body = S.calView==='month'?monthView(events,conflictEventIds)
    : S.calView==='week'?weekView(events,conflictEventIds)
    : dayView(events,conflictEventIds);
  return `

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function todayIso(){return isoLocal(new Date())}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoLocal(d)}
function safeUrl(u){u=String(u||'').trim(); if(!u)return ''; return /^https?:\/\//i.test(u)?u:'https://'+u.replace(/^[a-z]+:\/*/i,'')}
function myEmail(){return (S.session&&S.session.user&&S.session.user.email)||''}
function fmt12(hhmm){if(!hhmm)return 'TBD';const [h,m]=hhmm.split(':').map(Number);return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`}
function timeAgo(iso){const s=(Date.now()-new Date(iso))/1000;if(s<60)return 'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';if(s<604800)return Math.floor(s/86400)+'d ago';return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'})}
function priorityBadge(k){const cls={urgent:'badge-bad',high:'badge-warn',normal:'badge-neutral',low:'badge-info'}[k]||'badge-neutral';return `<span class="badge ${cls}">${esc((PRIORITIES.find(x=>x[0]===k)||[k,k])[1])}</span>`}
function activeProjects(){return PROJECTS.filter(p=>!p.archived)}
function logActivity(p,text,kind){p.activity=p.activity||[];p.activity.unshift({id:uid(),at:new Date().toISOString(),by:myEmail(),kind:kind||'log',text});if(p.activity.length>300)p.activity.length=300}

function templateFor(type){const t=SETTINGS.templates&&SETTINGS.templates[type];return (t&&t.trim())?t:(DEFAULT_TEMPLATES[type]||DEFAULT_TEMPLATES.Event)}
function parseTemplate(text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const parts=l.split('|').map(s=>s.trim());
    if(parts.length===1)return {phase:'Admin',title:parts[0],offset:null};
    const off=parts[2]===undefined||parts[2]===''?null:Number(parts[2]);
    return {phase:TASK_PHASES.includes(parts[0])?parts[0]:'Admin',title:parts[1],offset:isNaN(off)?null:off};

/* ── AI + Google (Supabase Edge Functions) ── */
async function callFn(name,body){
  const {data,error}=await sb.functions.invoke(name,{body});
  if(error){
    let msg=error.message, code='';
    try{const j=await error.context.json();msg=j.message||j.error||msg;code=j.error||''}catch(_){}
    if(/Failed to send|NOT_FOUND|404/i.test(msg)&&!code){msg=name==='ai'?'The AI service isn’t deployed yet.':'The Google Calendar service isn’t deployed yet.';code='not_deployed'}
    const e=new Error(msg);e.code=code;throw e;
  }
  return data;
}
async function ai(task,extra){
  S.aiBusy=task;render();
  try{ return await callFn('ai',Object.assign({task,style:styleSettings(),today:todayIso()},extra||{})); }
  finally{ S.aiBusy=null;render(); }
}

async function loadGoogleStatus(){

async function loadGcalEvents(){
  try{
    const now=new Date(); const min=new Date(now);min.setDate(min.getDate()-31); const max=new Date(now);max.setDate(max.getDate()+120);
    const {events}=await callFn('google',{action:'list_events',timeMin:min.toISOString(),timeMax:max.toISOString()});
    const mine=new Set(EXTRA_EVENTS.map(e=>e.gcalEventId).filter(Boolean));
    GCAL_EVENTS=(events||[]).filter(e=>!mine.has(e.id)).map(e=>({id:e.id,title:e.title,date:String(e.start).slice(0,10),start:e.start,link:e.link,htmlLink:e.htmlLink,allDay:e.allDay}));
    render();
  }catch(_){}
}
function sanitizeHtml(html){
  const ok=new Set(['H1','H2','H3','P','UL','OL','LI','STRONG','B','EM','I','TABLE','THEAD','TBODY','TR','TH','TD','BR','HR','DIV','SPAN']);
  const doc=new DOMParser().parseFromString('<div>'+html+'</div>','text/html');
  const walk=node=>{[...node.children].forEach(el=>{
    if(!ok.has(el.tagName)){ if(['SCRIPT','STYLE','IFRAME','OBJECT','EMBED','LINK','META'].includes(el.tagName)){el.remove();return} el.replaceWith(...el.childNodes); return walk(node); }
    [...el.attributes].forEach(a=>{if(a.name!=='colspan')el.removeAttribute(a.name)}); walk(el);
  })};
  walk(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}

/* ── Dashboard additions ── */
function pmDashboard(){
  const today=todayIso(), wk=addDays(today,7);
  const open=allTaskItems().filter(({t})=>t.status!=='done');
  const overdue=open.filter(({t})=>t.due&&t.due<today);
  const soon=open.filter(({t})=>t.due&&t.due>=today&&t.due<=wk);
  const meets=EXTRA_EVENTS.filter(e=>(e.meetingKind||e.type==='Meeting'||e.type==='Call')&&e.date>=today&&e.date<=wk).sort((a,b)=>(a.startIso||a.date).localeCompare(b.startIso||b.date));
  const delivs=[];activeProjects().forEach(p=>(p.deliverables||[]).forEach(d=>{if(d.due&&d.status!=='Delivered'&&d.due<=addDays(today,14))delivs.push({p,d})}));

  return `<div class="pm-stats">

    <div class="card stat-tile" data-action="nav" data-view="proposals" style="cursor:pointer"><span class="stat-label">Proposals out</span><span class="val">${awaiting}</span><span class="sub">Waiting on the client</span></div>

  </div>

      ${top.length?top.map(({p,t})=>taskRow(p,t,true)).join(''):'<div class="empty" style="margin:12px">Nothing due this week.</div>'}</div>

        <div class="event-date"><b>${dayNum(d.due)}</b><span>${monAbbr(d.due)}</span></div>
        <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(d.name)}</div><div class="muted-sm">${esc(p.name)} · ${esc(d.status||'Not started')}</div></div>

/* ── Global search (⌘K) ── */
function searchHits(q){
  q=q.trim().toLowerCase(); if(!q)return [];
  const hits=[]; const m=s=>String(s||'').toLowerCase().includes(q);
  PROJECTS.forEach(p=>{if(m(p.name)||m(p.client)||m(p.brief))hits.push({kind:'Project',label:p.name,sub:p.client+' · '+p.type,act:`data-action="openProject" data-id="${p.id}"`})});
  CLIENTS.forEach(c=>{if(m(c.name)||m(c.company)||m(c.email))hits.push({kind:'Client',label:c.name,sub:c.company||c.email,act:`data-action="openClient" data-cid="${c.id}"`})});
  allTaskItems().forEach(({p,t})=>{if(m(t.title))hits.push({kind:'Task',label:t.title,sub:p.name+(t.due?' · '+fmtDate(t.due):''),act:`data-action="openProject" data-id="${p.id}" data-tab="tasks"`})});
  CONTACTS.forEach(c=>{if(m(c.name)||m(c.role))hits.push({kind:'Crew',label:c.name,sub:c.role,act:`data-action="nav" data-view="contacts"`})});
  LOCATIONS.forEach(l=>{if(m(l.name)||m(l.address))hits.push({kind:'Location',label:l.name,sub:l.address,act:`data-action="nav" data-view="locations"`})});
  EXTRA_EVENTS.forEach(e=>{if(m(e.label))hits.push({kind:'Event',label:e.label,sub:fmtDate(e.date),act:`data-action="calGoDay" data-date="${e.date}"`})});
  return hits.slice(0,40);
}

/* ── Actions ── */
function getTask(el){const p=project(el.dataset.id);return {p,t:p&&(p.tasks||[]).find(t=>t.id===el.dataset.task)}}
function getDeliv(el){const p=project(el.dataset.id);return {p,d:p&&(p.deliverables||[]).find(d=>d.id===el.dataset.deliv)}}
function val(id){const e=document.getElementById(id);return e?e.value.trim():''}
async function createClientRecord(c){
  const {data,error}=await sb.from('clients').insert(clientToRow(c)).select().single();
  if(error){showToast('Could not save client: '+error.message);return null}
  const obj=rowToClient(data); if(!CLIENTS.some(x=>x.id===obj.id))CLIENTS.push(obj); return obj;
}
async function insertProject(draft){
  draft.invoice=draft.invoice||defaultInvoice(draft);
  const {data,error}=await sb.from('projects').insert(projectToRow(draft)).select().single();
  if(error){showToast('Could not create project: '+error.message);return null}
  const p=rowToProject(data); if(!PROJECTS.some(x=>x.id===p.id))PROJECTS.push(p); return project(p.id)||p;
}
async function generateProposal(p,instructions){
  try{
    const r=await ai('proposal',{project:projectFacts(p),instructions:instructions||''});
    p.proposal=Object.assign(p.proposal||{status:'draft'},{html:sanitizeHtml(r.html),updatedAt:new Date().toISOString()});
    logActivity(p,'Proposal written with AI'); scheduleSave('projects',p); render(); showToast('Proposal ready — edit anything, it saves as you type');
  }catch(e){showToast(e.message)}
}

  saveMeeting:async()=>{
    const date=val('m-date'),time=val('m-time')||'11:00',dur=Number(val('m-dur'))||30,kind=val('m-kind');
    if(!date){showToast('Pick a date');return}
    const start=new Date(date+'T'+time); const end=new Date(start.getTime()+dur*60000);
    const guests=val('m-guests').split(/[,;\s]+/).filter(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
    const gcalBox=document.getElementById('m-gcal'), notifyBox=document.getElementById('m-notify');
    const draft={projectId:val('m-proj')||null,type:kind==='phone'?'Call':'Meeting',label:val('m-title')||'Meeting',date,
      callTime:fmt12(time),wrapTime:fmt12(String(end.getHours()).padStart(2,'0')+':'+String(end.getMinutes()).padStart(2,'0')),crew:[],
      attendees:guests,meetingKind:kind,durationMin:dur,startIso:start.toISOString(),notes:val('m-notes'),meetingLink:'',gcalEventId:''};
    const btn=document.querySelector('[data-action="saveMeeting"]'); if(btn){btn.disabled=true;btn.textContent='Scheduling…'}
    try{

        const p=project(draft.projectId);

        draft.gcalEventId=r.id||''; draft.meetingLink=r.meetLink||'';
      }
      const {data,error}=await sb.from('extra_events').insert(eventToRow(draft)).select().single();
      if(error)throw error;
      const ev=rowToEvent(data); if(!EXTRA_EVENTS.some(x=>x.id===ev.id))EXTRA_EVENTS.push(ev);
      const p=project(draft.projectId); if(p){logActivity(p,`Meeting scheduled: ${draft.label} — ${fmtDate(date)} ${draft.callTime}`);scheduleSave('projects',p)}
      S.modal=null;showToast(draft.gcalEventId?(draft.meetingLink?'Scheduled — on the calendar with a Meet link':'Scheduled — on the calendar'):'Meeting saved');

document.addEventListener('input',e=>{
  const el=e.target, a=el.dataset.action; if(!a)return;
  if(a==='editTask'){const {p,t}=getTask(el);if(!t)return;t[el.dataset.field]=el.value;if(el.dataset.field==='due')t.offset=null;scheduleSave('projects',p)}
  else if(a==='editDeliv'){const {p,d}=getDeliv(el);if(!d)return;d[el.dataset.field]=el.dataset.field==='revisionsAllowed'?Number(el.value)||0:el.value;scheduleSave('projects',p)}
  else if(a==='editVersion'){const {p,d}=getDeliv(el);const v=d&&(d.versions||[]).find(x=>x.id===el.dataset.ver);if(!v)return;v[el.dataset.field]=el.value;scheduleSave('projects',p)}
  else if(a==='editGear'){const p=project(el.dataset.id);const g=(p.gear||[]).find(x=>x.id===el.dataset.gear);if(!g)return;g[el.dataset.field]=el.value;scheduleSave('projects',p)}
  else if(a==='editTags'){const p=project(el.dataset.id);p.tags=el.value.split(',').map(s=>s.trim()).filter(Boolean);scheduleSave('projects',p)}
  else if(a==='editProposal'){const p=project(el.dataset.id);p.proposal.html=el.innerHTML;p.proposal.updatedAt=new Date().toISOString();scheduleSave('projects',p)}
  else if(a==='editStyle'){styleSettings()[el.dataset.field]=el.value;saveSetting('style')}
  else if(a==='editTemplate'){SETTINGS.templates=SETTINGS.templates||{};SETTINGS.templates[el.dataset.type]=el.value;saveSetting('templates')}
  else if(a==='pmFilter'&&el.tagName==='INPUT'){S.pf[el.dataset.key]=el.value;render();const b=document.querySelector('[data-action="pmFilter"][data-key="q"]');if(b){b.focus();b.setSelectionRange(b.value.length,b.value.length)}}
  else if(a==='clientSearch'){S.cq=el.value;render();const b=document.querySelector('[data-action="clientSearch"]');if(b){b.focus();b.setSelectionRange(b.value.length,b.value.length)}}
  else if(a==='globalSearch'){S.gq=el.value;render();const b=document.getElementById('gs-input');if(b){b.focus();b.setSelectionRange(b.value.length,b.value.length)}}
});
document.addEventListener('change',e=>{
  const el=e.target, a=el.dataset.action; if(!a)return;
  if(a==='editTask'&&el.dataset.field!=='title')render();
  else if(a==='editDeliv'&&(el.dataset.field==='status'||el.dataset.field==='due'))render();
  else if(a==='editGear')render();
  else if(a==='pmFilter'&&el.tagName==='SELECT'){S.pf[el.dataset.key]=el.value;render()}
  else if(a==='pmSort'){S.psort=el.value;render()}
  else if(a==='setTaskProject'){S.tproj=el.value;render()}
  else if(a==='setProjectClient'){const p=project(el.dataset.id);
    if(el.value==='__new'){createClientRecord({name:p.client,company:'',email:'',phone:'',instagram:'',source:'',notes:''}).then(c=>{if(c){p.clientId=c.id;scheduleSave('projects',p);render();S.clientId=c.id;S.modal='client';render()}});return}
    p.clientId=el.value||null;const c=client(p.clientId);if(c)p.client=c.name;scheduleSave('projects',p);render()}
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&S.session){e.preventDefault();PM_ACTIONS.openSearch();return}
  if(e.key==='Escape'&&S.modal){S.modal=null;render();return}
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();const fn=ACTIONS[e.target.dataset.enter];if(fn)fn(e.target,e)}
  if(e.key==='Enter'&&S.modal==='search'&&e.target.id==='gs-input'){const h=document.querySelector('.search-hit');if(h){h.click()}}
});
/* Kanban drag & drop: drag a card onto a column to change its stage. */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.pcard[data-id]');if(!c)return;e.dataTransfer.setData('text/plain',c.dataset.id);c.classList.add('dragging')});
document.addEventListener('dragend',e=>{const c=e.target.closest&&e.target.closest('.pcard');if(c)c.classList.remove('dragging');document.querySelectorAll('.drop-over').forEach(x=>x.classList.remove('drop-over'))});
document.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('[data-drop-stage]');if(!col)return;e.preventDefault();document.querySelectorAll('.drop-over').forEach(x=>x!==col&&x.classList.remove('drop-over'));col.classList.add('drop-over')});
document.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('[data-drop-stage]');if(!col)return;e.preventDefault();
  const p=project(e.dataTransfer.getData('text/plain'));if(!p||p.stage===col.dataset.dropStage)return render();
  ACTIONS.setStage({dataset:{id:p.id,stage:col.dataset.dropStage}})});
