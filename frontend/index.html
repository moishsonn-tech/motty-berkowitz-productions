<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Motty Berkowitz Video Production</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ── Tokens ──────────────────────────────────────────────────────────────── */
:root{
  --accent:#F0B429; --accent-dark:#C4900E; --accent-wash:rgba(240,180,41,.14); --accent-ink:#241A02;
  --bg:#F5F2EC; --surface:#FFFFFF; --surface-2:#EEEAE1;
  --sb-bg:#1A1814; --sb-ink:#EFEDE8; --sb-mut:#948F86; --sb-line:rgba(255,255,255,.08); --sb-active-ink:#241A02;
  --ink:#201E26; --ink-2:#5B5867; --ink-3:#8B8894; --ink-4:#C7C4CC;
  --line:#E4E0D6; --line-2:#EEEBE3;
  --good:#3E8F63; --good-wash:rgba(62,143,99,.13);
  --warn:#C9622A; --warn-wash:rgba(201,98,42,.13);
  --bad:#C23B3B; --bad-wash:rgba(194,59,59,.13);
  --info:#4A6FA5; --info-wash:rgba(74,111,165,.13);
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px;
  --sh-sm:0 1px 3px rgba(20,18,10,.06),0 1px 1px rgba(20,18,10,.04);
  --sh-md:0 4px 12px rgba(20,18,10,.09),0 2px 4px rgba(20,18,10,.05);
  --sh-lg:0 16px 32px rgba(20,18,10,.14),0 4px 10px rgba(20,18,10,.07);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sidebar-w:236px; --topbar-h:60px; --bottomnav-h:64px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#17161C; --surface:#201F27; --surface-2:#26252E;
    --ink:#EEECE8; --ink-2:#B7B4BE; --ink-3:#87838F; --ink-4:#514E58;
    --line:#34323C; --line-2:#2A2932;
    --accent-wash:rgba(200,134,46,.18); --good-wash:rgba(62,143,99,.18);
    --warn-wash:rgba(201,98,42,.18); --bad-wash:rgba(194,59,59,.18); --info-wash:rgba(74,111,165,.18);
  }
}
*{box-sizing:border-box;margin:0;padding:0}
button,input,select,textarea{font:inherit;color:inherit}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-weight:800;letter-spacing:-.01em;text-wrap:balance}
a{color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
::selection{background:var(--accent-wash)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ── Shell ───────────────────────────────────────────────────────────────── */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);flex:none;background:var(--sb-bg);color:var(--sb-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.brand svg{width:30px;height:30px;flex:none}
.brand-name{font-size:16px;font-weight:800;letter-spacing:-.01em}
.brand-sub{font-size:10.5px;color:var(--sb-mut);letter-spacing:.03em}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-md);
  color:var(--sb-mut);cursor:pointer;font-weight:600;font-size:13.5px;transition:background .15s,color .15s;
  border:none;background:none;text-align:left;width:100%}
.nav-item .ico{width:18px;height:18px;flex:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--sb-ink)}
.nav-item.active{background:var(--accent);color:var(--sb-active-ink)}
.nav-group-label{font-size:10px;font-weight:700;color:var(--sb-mut);text-transform:uppercase;
  letter-spacing:.09em;padding:16px 12px 6px}
.sidebar-foot{border-top:1px solid var(--sb-line);padding-top:12px;margin-top:8px}
.sidebar-version{font-size:10.5px;color:var(--sb-mut);padding:4px 12px}

.shell-main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;
  background:rgba(245,242,236,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
@media (prefers-color-scheme:dark){.topbar{background:rgba(23,22,28,.82)}}
.topbar-title{font-size:16px;font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px}
.hamburger .ico{width:22px;height:22px}
.search-box{position:relative;width:260px;flex:none}
.search-box input{width:100%;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);font-size:13px}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-box .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.content{flex:1;padding:24px;max-width:1440px;width:100%;margin:0 auto;padding-bottom:calc(24px + env(safe-area-inset-bottom))}

.bottomnav{display:none}

/* ── Icons ───────────────────────────────────────────────────────────────── */
.ico{stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ── Buttons / chips / inputs ───────────────────────────────────────────── */
.btn{padding:9px 16px;border-radius:var(--r-md);font-size:13px;font-weight:700;cursor:pointer;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:6px;transition:transform .12s,filter .15s,background .15s;white-space:nowrap}
.btn .ico{width:15px;height:15px}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-subtle{background:var(--surface-2);color:var(--ink-2)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:var(--r-sm)}
.iconbtn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.iconbtn .ico{width:16px;height:16px}
.iconbtn:hover{background:var(--surface-2)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:999px;font-size:12.5px;
  font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.chip:hover{background:var(--surface-2)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-ms-overflow-style:none;scrollbar-width:none}
.chip-row::-webkit-scrollbar{display:none}

.field label{display:block;font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;
  letter-spacing:.06em;margin-bottom:6px}
.inp,.sel,.txt{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);
  padding:9px 12px;font-size:13.5px}
.inp:focus,.sel:focus,.txt:focus{outline:none;border-color:var(--accent)}
.txt{resize:vertical;min-height:64px;font-family:var(--font)}
.field{margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ── Cards / layout helpers ─────────────────────────────────────────────── */
.card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);
  padding:20px 22px;box-shadow:var(--sh-sm)}
.stat-label{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}
.badge-good{background:var(--good-wash);color:var(--good)}
.badge-warn{background:var(--warn-wash);color:var(--warn)}
.badge-bad{background:var(--bad-wash);color:var(--bad)}
.badge-info{background:var(--info-wash);color:var(--info)}
.badge-neutral{background:var(--surface-2);color:var(--ink-2)}
.avatar{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:800;color:#fff;flex:none;border:2px solid var(--surface)}
.avatar-stack{display:flex}
.avatar-stack .avatar{margin-left:-8px}
.avatar-stack .avatar:first-child{margin-left:0}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}
.empty .ico{width:34px;height:34px;margin:0 auto 10px;opacity:.5}

.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:23px}
.page-head p{color:var(--ink-2);font-size:13.5px;margin-top:3px}

/* ── Dashboard ───────────────────────────────────────────────────────────── */
.welcome-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.welcome-head svg{width:32px;height:32px;flex:none}
.welcome-head h1{font-size:22px}
.welcome-head .wdate{color:var(--ink-3);font-size:12.5px;font-weight:600;margin-top:1px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-tile{cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat-tile:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.stat-tile.flagship{grid-column:span 2;background:var(--accent-wash);border-color:rgba(200,134,46,.35)}
.stat-tile .val{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.01em;margin:5px 0 2px}
.stat-tile.flagship .val{font-size:32px;color:var(--accent-dark)}
.stat-tile .sub{font-size:11.5px;color:var(--ink-3)}
.stat-tile.flag .val{color:var(--bad)}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.section-head h2{font-size:16px}
.step-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm)}
.step-row .ico{width:16px;height:16px;color:var(--accent);flex:none}
.step-row .step-text{flex:1;font-size:13px;color:var(--ink-2)}
.step-row .step-text b{font-weight:700;color:var(--ink)}
.oproj-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm);
  transition:transform .15s,box-shadow .15s}
.oproj-row:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
.oproj-name{font-weight:700;font-size:13.5px}
.oproj-client{font-size:12px;color:var(--ink-3)}
.oproj-date{font-size:12px;color:var(--ink-2);width:110px;flex:none}
@media (max-width:900px){.stat-row{grid-template-columns:repeat(2,1fr)}.stat-tile.flagship{grid-column:span 2}
  .oproj-date{width:auto}}

/* ── Kanban ──────────────────────────────────────────────────────────────── */
.board{display:grid;grid-template-columns:repeat(5,minmax(250px,1fr));gap:14px;align-items:start;overflow-x:auto}
.col{background:var(--surface-2);border-radius:var(--r-lg);padding:12px;min-width:250px}
.col-head{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 12px}
.col-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2)}
.col-count{font-size:11px;font-weight:700;color:var(--ink-3);background:var(--surface);border-radius:999px;
  padding:2px 8px;border:1px solid var(--line)}
.col-body{display:flex;flex-direction:column;gap:10px;min-height:40px}
.pcard{background:var(--surface);border-radius:var(--r-md);border:1px solid var(--line);padding:14px;cursor:pointer;
  box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .15s}
.pcard:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.type-dot{width:8px;height:8px;border-radius:50%;flex:none}
.pcard-title{font-size:14px;font-weight:700;line-height:1.3;margin-bottom:3px}
.pcard-client{font-size:12px;color:var(--ink-3);margin-bottom:11px}
.pcard-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pcard-date{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:4px}
.pcard-date .ico{width:12px;height:12px}

/* ── Tabs ────────────────────────────────────────────────────────────────── */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabbar::-webkit-scrollbar{display:none}
.tab{padding:11px 15px;font-size:13px;font-weight:700;color:var(--ink-3);cursor:pointer;border:none;background:none;
  border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--accent);border-color:var(--accent)}

/* ── Project detail header ──────────────────────────────────────────────── */
.slate-strip{height:9px;border-radius:999px;overflow:hidden;background:
  repeating-linear-gradient(115deg,var(--ink) 0 10px,var(--surface) 10px 12px,var(--accent) 12px 24px,var(--surface) 24px 26px);
  opacity:.9;margin-bottom:16px}
.back-link{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-size:12.5px;font-weight:600;
  cursor:pointer;margin-bottom:12px;background:none;border:none}
.back-link .ico{width:14px;height:14px}
.back-link:hover{color:var(--ink)}
.proj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.proj-title{font-size:24px;margin-bottom:4px}
.proj-sub{color:var(--ink-2);font-size:13.5px}
.stage-track{display:flex;gap:6px;margin-top:14px}
.stage-pip{flex:1;text-align:center;padding:7px 4px;border-radius:var(--r-sm);font-size:10.5px;font-weight:700;
  text-transform:uppercase;letter-spacing:.04em;background:var(--surface-2);color:var(--ink-3);cursor:pointer;
  border:1px solid transparent}
.stage-pip.done{background:var(--good-wash);color:var(--good)}
.stage-pip.now{background:var(--accent);color:#fff}

/* ── Scenes / storyline ─────────────────────────────────────────────────── */
.scene-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;
  margin-bottom:12px;display:flex;gap:14px}
.scene-num{font-family:var(--mono);font-weight:800;font-size:13px;color:var(--accent);flex:none;width:38px;
  padding-top:2px}
.scene-body{flex:1;min-width:0}
.scene-body .field{margin-bottom:10px}
.scene-loc-select{max-width:280px}
.audio-panel{background:var(--sb-bg);color:var(--sb-ink);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:18px}
.audio-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.audio-title{font-weight:800;font-size:14.5px}
.audio-artist{color:var(--sb-mut);font-size:12px}
.wave{display:flex;align-items:flex-end;gap:2px;height:46px;position:relative;margin-bottom:6px;cursor:pointer}
.wave i{flex:1;background:rgba(200,134,46,.45);border-radius:2px;display:block;pointer-events:none}
.wave-progress{position:absolute;top:0;left:0;bottom:0;background:rgba(240,180,41,.16);pointer-events:none;border-radius:2px}
.wave-marker{position:absolute;top:-6px;height:58px;width:2px;background:var(--accent);cursor:ew-resize;z-index:2}
.wave-marker::before{content:'';position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:9px;height:9px;
  border-radius:50%;background:var(--accent)}
.wave-markers{display:flex;justify-content:space-between;font-size:10px;font-family:var(--mono);color:var(--sb-mut)}
.wave-markers span{display:flex;flex-direction:column;align-items:center;gap:2px}
.wave-markers b{color:var(--accent);font-weight:700}
.audio-controls{display:flex;align-items:center;gap:10px;margin-top:12px}
.audio-playbtn{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#1A1814;border:none;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .12s}
.audio-playbtn:active{transform:scale(.92)}
.audio-playbtn .ico{width:15px;height:15px}
.audio-time{font-size:12px;color:var(--sb-mut)}
.audio-hint{font-size:11.5px;color:var(--sb-mut)}
.audio-loadbtn{margin-left:auto;cursor:pointer}
.scene-t{font-size:10px;color:var(--accent);font-weight:700;margin-top:3px}

/* ── Shot list ───────────────────────────────────────────────────────────── */
.shot-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.loc-group{margin-bottom:22px}
.loc-group-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.loc-group-head .ico{width:15px;height:15px;color:var(--ink-3)}
.loc-group-head b{font-size:13.5px}
.loc-group-head span{color:var(--ink-3);font-size:12px}
.shot-row{display:grid;grid-template-columns:64px 100px 1fr 130px 150px;gap:14px;align-items:center;
  padding:11px 4px;border-bottom:1px solid var(--line-2)}
.shot-row:last-child{border-bottom:none}
.shot-code{font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--ink-2)}
.shot-desc{font-size:13px;color:var(--ink)}
.shot-equip{font-size:11.5px;color:var(--ink-3)}
.status-sel{font-size:11.5px;font-weight:700;padding:5px 8px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface)}

/* ── Directory grids (locations/contacts) ───────────────────────────────── */
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.loc-card,.person-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px;box-shadow:var(--sh-sm);transition:box-shadow .15s,transform .15s}
.loc-card:hover,.person-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.loc-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.loc-name{font-weight:700;font-size:14px;margin-bottom:2px}
.loc-addr{font-size:12px;color:var(--ink-3);display:flex;gap:4px;align-items:flex-start;margin-bottom:8px}
.loc-addr .ico{width:12px;height:12px;flex:none;margin-top:2px}
.loc-notes{font-size:12px;color:var(--ink-2);background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px;
  margin-top:8px;line-height:1.5}
.loc-used{font-size:11px;color:var(--ink-3);margin-top:10px}

.person-top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.person-top .avatar{width:42px;height:42px;font-size:14px}
.person-name{font-weight:700;font-size:14px}
.person-role{font-size:12px;color:var(--ink-3)}
.person-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2);
  padding-top:10px;margin-top:10px;border-top:1px solid var(--line-2)}

/* ── Schedule ────────────────────────────────────────────────────────────── */
.conflict-banner{display:flex;gap:12px;align-items:flex-start;background:var(--bad-wash);color:var(--bad);
  border:1px solid rgba(194,59,59,.3);border-radius:var(--r-md);padding:14px 16px;margin-bottom:18px}
.conflict-banner .ico{width:18px;height:18px;flex:none;margin-top:1px}
.conflict-banner b{display:block;margin-bottom:2px}
.day-group{margin-bottom:22px}
.day-label{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:10px}
.event-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;
  display:flex;gap:16px;align-items:center;margin-bottom:10px;box-shadow:var(--sh-sm)}
.event-card.conflict{border-color:rgba(194,59,59,.4);box-shadow:0 0 0 1px rgba(194,59,59,.15)}
.event-date{width:52px;flex:none;text-align:center}
.event-date b{display:block;font-size:20px;line-height:1.1}
.event-date span{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;font-weight:700}
.event-main{flex:1;min-width:0}
.event-title{font-weight:700;font-size:14px;margin-bottom:3px}
.event-sub{font-size:12px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.event-sub span{display:flex;gap:4px;align-items:center}
.event-sub .ico{width:12px;height:12px}

.callsheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cs-band{background:var(--sb-bg);color:var(--sb-ink);padding:20px 24px}

.cs-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-bottom:10px}
.cs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cs-crew-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.cs-actions{display:flex;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:var(--surface-2)}

/* ── Invoicing ───────────────────────────────────────────────────────────── */
.inv-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.inv-stat{padding:16px 18px}
.inv-stat .val{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
.inv-item-row{display:grid;grid-template-columns:1fr 130px 32px;gap:10px;align-items:center;margin-bottom:8px}
.inv-item-row .inp{font-size:13px}
.inv-item-amt{text-align:right;font-family:var(--mono)}
.inv-remove{width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-3)}
.inv-remove:hover{background:var(--bad-wash);color:var(--bad);border-color:transparent}
.inv-totals{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.inv-total-row{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.inv-total-row.grand{font-size:15px;font-weight:800;color:var(--ink);padding-top:6px;border-top:1px solid var(--line-2)}
.inv-total-row .mono{font-variant-numeric:tabular-nums}
.inv-pay-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;
  border-bottom:1px solid var(--line-2)}
.inv-pay-row:last-child{border-bottom:none}
.inv-pay-check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:13px}
.inv-pay-check input{width:17px;height:17px;accent-color:var(--good)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--sb-bg);color:var(--sb-ink);

.opener{position:fixed;inset:0;background:#1A1814;z-index:9999;display:flex;align-items:center;

.opener-mark-wrap{position:relative;display:inline-flex;
  animation:mb-pulse .6s cubic-bezier(.34,1.56,.64,1) 1.6s both}
.opener-mark{width:150px;height:auto;overflow:visible;display:block}
.opener-mark path{fill:none;stroke:#F0B429;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:100;stroke-dashoffset:100;animation:mb-draw 1.5s cubic-bezier(.65,0,.35,1) .2s forwards}
.opener-ring{position:absolute;top:50%;left:50%;width:170px;height:170px;margin:-85px 0 0 -85px;
  border:1.5px solid #F0B429;border-radius:50%;opacity:0;animation:mb-ring 1s ease-out forwards}
.opener-ring.r1{animation-delay:1.6s}
.opener-ring.r2{animation-delay:1.78s}
.opener-word{opacity:0;text-align:center;animation:mb-fadeup .6s ease 1.9s forwards}
.ow-name{font-family:var(--font);font-size:19px;font-weight:700;color:#F0B429;letter-spacing:-.01em}
.ow-tag{font-family:var(--font);font-size:10.5px;font-weight:600;color:#B8A87E;letter-spacing:.28em;margin-top:5px}
@keyframes mb-draw{to{stroke-dashoffset:0}}
@keyframes mb-pulse{
  0%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(240,180,41,0))}
  40%{transform:scale(.95)}
  70%{transform:scale(1.06);filter:drop-shadow(0 0 20px rgba(240,180,41,.6))}
  100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(240,180,41,0))}
}
@keyframes mb-ring{0%{transform:scale(.3);opacity:.5}100%{transform:scale(2.3);opacity:0}}
@keyframes mb-fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes mb-lift{to{transform:translateY(-100%)}}
@media (prefers-reduced-motion:reduce){
  .opener-mark path{animation:none;stroke-dashoffset:0}
  .opener-mark-wrap{animation:none}
  .opener-ring{display:none}
  .opener-word{animation:none;opacity:1}
}

/* ── shot-list generation from storyline scenes ─────────────────────────── */
function shotTypesFor(text){
  const t=text.toLowerCase(); const types=[];
  if(/drone|aerial|overhead|pull-back/.test(t))types.push({t:'Drone',eq:'Drone + ND filters'});
  if(/close|hands|ring|detail|eyes/.test(t))types.push({t:'Close-Up',eq:'85mm prime'});
  if(/track|walk|dance|enter|follow/.test(t))types.push({t:'Tracking',eq:'Gimbal'});
  if(/wide|establish|crowd|venue|skyline|campus/.test(t)||!types.length)types.push({t:'Wide',eq:'24mm + slider'});
  types.push({t:'Medium',eq:'50mm'});
  const seen=new Set(); return types.filter(x=>seen.has(x.t)?false:seen.add(x.t));
}
function shotsForProject(p){
  const rows=[];
  (p.scenes||[]).forEach((sc,i)=>{
    const types=shotTypesFor(sc.heading+' '+sc.desc);
    types.forEach((ty,j)=>{
      rows.push({code:`SC${i+1}-${String.fromCharCode(65+j)}`,type:ty.t,equip:ty.eq,desc:sc.heading,
        locId:sc.locId,sceneId:sc.id,status:'Planned'});
    });
  });
  return rows;
}

/* ── invoicing ────────────────────────────────────────────────────────────── */
function parseMoney(s){return Number(String(s==null?'':s).replace(/[^0-9.\-]/g,''))||0}
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('en-US')}
function defaultInvoice(p){
  const items=p.crew.map(cid=>{const c=contact(cid);const rate=parseMoney(c.rate);
    return rate?{id:'ci-'+c.id,desc:c.role+' ('+c.name+')',amount:rate}:null}).filter(Boolean);
  const crewSum=items.reduce((s,i)=>s+i.amount,0);
  const budgetNum=parseMoney(p.budget);
  const fee=Math.max(budgetNum-crewSum, budgetNum?Math.round(budgetNum*0.3):500);
  items.unshift({id:'ci-fee',desc:p.type+' Package — Creative & Production Fee',amount:fee});
  return {number:'INV-'+(1044+PROJECTS.indexOf(p)),status:'draft',issueDate:new Date().toISOString().slice(0,10),
    dueDate:p.shootDate,depositPct:50,depositPaid:false,balancePaid:false,items};
}
function getInvoice(p){ if(!p.invoice) p.invoice=defaultInvoice(p); return p.invoice; }
function invoiceTotal(inv){ return inv.items.reduce((s,i)=>s+i.amount,0); }
function invoicePaidToDate(inv){
  const total=invoiceTotal(inv);
  if(inv.balancePaid) return total;
  if(inv.depositPaid) return Math.round(total*inv.depositPct/100);
  return 0;
}
function invoiceStatusLabel(inv){
  if(inv.balancePaid) return 'Paid';
  if(inv.status==='sent') return 'Sent';
  return 'Draft';
}
function invoiceStatusBadge(inv){
  const label=invoiceStatusLabel(inv);
  return {Paid:'badge-good',Sent:'badge-warn',Draft:'badge-neutral'}[label];
}

/* ── schedule + conflict detection ───────────────────────────────────────── */
function allEvents(){
  const evs = PROJECTS.map(p=>({id:'shoot-'+p.id,projectId:p.id,label:'Shoot Day',date:p.shootDate,
    callTime:p.callTime,wrapTime:p.wrapTime,crew:p.crew}));
  return evs.concat(EXTRA_EVENTS).sort((a,b)=>a.date.localeCompare(b.date));
}
function conflictsFor(events){
  const byDate={};
  events.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e)});
  const conflicts=[];
  Object.values(byDate).forEach(list=>{
    for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
      const shared=list[i].crew.filter(c=>list[j].crew.includes(c));
      if(shared.length) conflicts.push({a:list[i],b:list[j],people:shared});
    }
  });
  return conflicts;
}
function eventTitle(e){const p=project(e.projectId);return p?p.name+(e.label!=='Shoot Day'?' — '+e.label:''):e.label}

/* ── Audio player (real playback + real waveform, session-only — no upload/storage yet) ──── */
const AUD = {projectId:null, el:null, url:null, duration:0, peaks:[]};
function fmtTime(s){ if(!isFinite(s)||s<0)s=0; const m=Math.floor(s/60); const sec=Math.floor(s%60); return m+':'+String(sec).padStart(2,'0'); }
function computePeaks(buf,n){
  const data=buf.getChannelData(0), step=Math.floor(data.length/n)||1, peaks=[];
  for(let i=0;i<n;i++){
    let max=0; const start=i*step, end=Math.min(data.length,start+step);
    for(let j=start;j<end;j++){ const v=Math.abs(data[j]); if(v>max)max=v; }
    peaks.push(Math.max(4,Math.round(max*46)));
  }
  return peaks;
}
function updateAudioProgress(){
  const fill=document.getElementById('mb-progress'), time=document.getElementById('mb-time');
  if(fill && AUD.el.duration) fill.style.width=(AUD.el.currentTime/AUD.el.duration*100)+'%';
  if(time) time.textContent = fmtTime(AUD.el.currentTime)+' / '+fmtTime(AUD.el.duration||0);
}
async function handleAudioFile(input){
  const file=input.files[0]; if(!file)return;
  const pid=input.dataset.id;
  if(AUD.url) URL.revokeObjectURL(AUD.url);
  if(!AUD.el){
    AUD.el=new Audio();
    AUD.el.addEventListener('timeupdate',updateAudioProgress);
    AUD.el.addEventListener('play',render);
    AUD.el.addEventListener('pause',render);
    AUD.el.addEventListener('ended',render);
  }
  AUD.el.pause();
  AUD.projectId=pid; AUD.duration=0; AUD.peaks=[];
  AUD.url=URL.createObjectURL(file);
  AUD.el.src=AUD.url;
  AUD.el.addEventListener('loadedmetadata',function onMeta(){
    AUD.duration=AUD.el.duration||0;
    AUD.el.removeEventListener('loadedmetadata',onMeta);
    render();
  });
  showToast('Loading audio…');
  try{
    const arrBuf=await file.arrayBuffer();
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const audioBuf=await ctx.decodeAudioData(arrBuf);
    AUD.peaks=computePeaks(audioBuf,60);
    ctx.close();
  }catch(err){ AUD.peaks=[]; }
  render();
}
function audioPanel(p){
  const loaded = AUD.projectId===p.id && AUD.duration>0;
  const bars = loaded && AUD.peaks.length ? AUD.peaks
    : Array.from({length:60},(_,i)=>6+Math.round(20*Math.abs(Math.sin(i*0.4))+Math.random()*10));
  return `<div class="audio-panel">
    <div class="audio-head">
      <div><div class="audio-title">🎵 ${esc(p.audioTrack.title)}</div><div class="audio-artist">${esc(p.audioTrack.artist)} · ${esc(p.audioTrack.duration)}</div></div>
      <span class="badge badge-info">${loaded?'Audio loaded':'Audio synced to storyline'}</span>
    </div>
    <div class="wave" id="mb-wave" data-action="seekAudio" data-id="${p.id}">
      ${bars.map(h=>`<i style="height:${h}px"></i>`).join('')}
      ${loaded?`<div class="wave-progress" id="mb-progress" style="width:${AUD.el.duration?AUD.el.currentTime/AUD.el.duration*100:0}%"></div>`:''}
      ${loaded?p.scenes.map((sc,i)=>{
        const pct = sc.t!=null ? Math.max(0,Math.min(100,sc.t/AUD.duration*100)) : (i/(p.scenes.length-1||1)*100);
        return `<div class="wave-marker" style="left:${pct}%" data-action="dragMarker" data-id="${p.id}" data-scene="${sc.id}" title="SC${i+1}"></div>`;
      }).join(''):''}
    </div>
    <div class="wave-markers">${p.scenes.map((sc,i)=>`<span><b>SC${i+1}</b>${sc.t!=null?fmtTime(sc.t):Math.round(i/(p.scenes.length-1||1)*100)+'%'}</span>`).join('')}</div>
    <div class="audio-controls">
      ${loaded?`<button class="audio-playbtn" data-action="toggleAudioPlay" data-id="${p.id}">${AUD.el.paused?I.play:I.pause}</button>
        <span class="mono audio-time" id="mb-time">${fmtTime(AUD.el.currentTime)} / ${fmtTime(AUD.duration)}</span>`
        :`<span class="audio-hint">Pick a local audio file to play &amp; mark real split points — session only, no upload yet</span>`}
      <label class="btn btn-sm btn-subtle audio-loadbtn">${I.plus} ${loaded?'Replace':'Load'} Audio File
        <input type="file" accept="audio/*" style="display:none" data-action="loadAudioFile" data-id="${p.id}"></label>
    </div>
  </div>`;
}

/* ── Dashboard ────────────────────────────────────────────────────────── */
function nextSteps(){
  const steps=[];
  PROJECTS.forEach(p=>{
    if(p.stage==='delivered')return;
    const days=daysUntil(p.shootDate);
    if(p.stage==='inquiry'){
      steps.push({icon:I.mail,text:`Follow up with <b>${esc(p.client)}</b> — ${esc(p.name)} is still in Inquiry`,id:p.id});
    }
    if(days>=0 && days<=14 && p.stage!=='inquiry'){
      steps.push({icon:I.calendar,text:`<b>${esc(p.name)}</b> shoots in ${days} day${days===1?'':'s'} — confirm the call sheet`,id:p.id,tab:'callsheet'});
    }
    if((p.stage==='pre'||p.stage==='production') && p.crew.length===0){
      steps.push({icon:I.users,text:`<b>${esc(p.name)}</b> has no crew assigned yet`,id:p.id,tab:'crew'});
    }
    if((p.stage==='pre'||p.stage==='production') && (p.type==='Music Video'||p.type==='Wedding') && p.scenes.length===0){
      steps.push({icon:I.film,text:`Build the storyline for <b>${esc(p.name)}</b> to generate its shot list`,id:p.id,tab:'storyline'});
    }
    if(p.invoice){
      const inv=p.invoice, outstanding=invoiceTotal(inv)-invoicePaidToDate(inv);
      if(p.stage!=='inquiry' && invoiceStatusLabel(inv)==='Draft'){
        steps.push({icon:I.invoice,text:`Send the invoice for <b>${esc(p.name)}</b>`,id:p.id,tab:'financials'});
      } else if(p.stage==='production' && outstanding>0){
        steps.push({icon:I.invoice,text:`Collect the outstanding balance (${fmtMoney(outstanding)}) for <b>${esc(p.name)}</b>`,id:p.id,tab:'financials'});
      }
    }
  });
  return steps;
}

  const open=PROJECTS.filter(p=>p.stage!=='delivered');
  const upcoming=open.filter(p=>daysUntil(p.shootDate)>=0).sort((a,b)=>a.shootDate.localeCompare(b.shootDate));

      <span class="sub">${next?esc(next.name)+' · '+fmtDate(next.shootDate):'Nothing scheduled'}</span>
    </div>
    <div class="card stat-tile" data-action="nav" data-view="boards">

      <span class="sub">In progress right now</span>

      <span class="stat-label">Conflicts</span><span class="val">${conflicts.length}</span>
      <span class="sub">${conflicts.length?'Need resolving':'All clear'}</span>
    </div>
  </div>
  ${conflicts.length?`<div class="conflict-banner" style="margin-top:18px">${I.alert}<div>
      <b>${conflicts.length} scheduling conflict${conflicts.length===1?'':'s'} to resolve</b>
      ${conflicts.map(c=>`${c.people.map(pid=>esc(contact(pid).name)).join(', ')} booked on both "${esc(eventTitle(c.a))}" and "${esc(eventTitle(c.b))}", ${fmtDate(c.a.date)}`).join(' · ')}
    </div></div>`:''}
  <div class="section-head"><h2>Next Steps</h2></div>
  ${steps.length?steps.map(s=>`<div class="step-row" data-action="openProject" data-id="${s.id}" data-tab="${s.tab||'overview'}">${s.icon}<span class="step-text">${s.text}</span></div>`).join(''):`<div class="empty">You're all caught up — no open action items.</div>`}

    const crew=p.crew.slice(0,4).map(cid=>{const c=contact(cid);return c?`<span class="avatar" style="background:${personColor(c.id)}" title="${esc(c.name)}">${initials(c.name)}</span>`:''}).join('');

    </div>`;
  }).join(''):`<div class="empty">No open projects.</div>`}
  `;

/* ── Schedule ─────────────────────────────────────────────────────────── */
function viewSchedule(){
  const events=allEvents(); const conflicts=conflictsFor(events);
  const byDate={}; events.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e)});
  const conflictEventIds=new Set(); conflicts.forEach(c=>{conflictEventIds.add(c.a.id);conflictEventIds.add(c.b.id)});
  return `
  <div class="page-head"><div><h1>Schedule</h1><p>Every shoot day across every project — crew conflicts are flagged automatically.</p></div></div>
  ${conflicts.map(c=>`<div class="conflict-banner">${I.alert}<div>
      <b>Scheduling conflict on ${fmtDate(c.a.date)}</b>
      ${c.people.map(pid=>esc(contact(pid).name)).join(', ')} ${c.people.length===1?'is':'are'} booked on both
      "${esc(eventTitle(c.a))}" (${c.a.callTime}–${c.a.wrapTime}) and "${esc(eventTitle(c.b))}" (${c.b.callTime}–${c.b.wrapTime}).
    </div></div>`).join('')}
  ${Object.entries(byDate).map(([date,list])=>`
    <div class="day-group">
      <div class="day-label">${fmtDate(date)}</div>
      ${list.map(e=>{
        const p=project(e.projectId); const crew=e.crew.map(contact).filter(Boolean);
        const loc=p?getLoc(p.locationIds[0]):null;
        return `<div class="event-card ${conflictEventIds.has(e.id)?'conflict':''}" data-action="openProject" data-id="${e.projectId}">
          <div class="event-date"><b>${dayNum(date)}</b><span>${monAbbr(date)}</span></div>
          <div class="event-main">
            <div class="event-title">${esc(eventTitle(e))} ${conflictEventIds.has(e.id)?'<span class=\"badge badge-bad\">Conflict</span>':''}</div>
            <div class="event-sub">
              <span class="mono">${I.clock.replace('class="ico"','class="ico" style="width:12px;height:12px"')}${e.callTime}–${e.wrapTime}</span>
              ${loc?`<span>${I.pin.replace('class="ico"','class="ico" style="width:12px;height:12px"')}${esc(loc.name)}</span>`:''}
              <span>${I.users.replace('class="ico"','class="ico" style="width:12px;height:12px"')}${crew.map(c=>esc(c.name)).join(', ')||'No crew yet'}</span>
            </div>
          </div>
          <span class="badge badge-neutral">${esc(p?p.type:'')}</span>
        </div>`;
      }).join('')}
    </div>`).join('')}
  `;
}

/* ══════════════════════════════ ACTIONS ══════════════════════════════ */
function showToast(msg){S.toast=msg;render();setTimeout(()=>{S.toast=null;render()},2600)}
const ACTIONS = {
  nav:(el)=>{S.view=el.dataset.view;S.sidebarOpen=false;if(el.dataset.view==='project')S.tab='overview';render()},
  openSidebar:()=>{S.sidebarOpen=true;render()},
  closeSidebar:()=>{S.sidebarOpen=false;render()},
  openProject:(el)=>{
    if(AUD.el && AUD.projectId && AUD.projectId!==el.dataset.id) AUD.el.pause();
    S.projectId=el.dataset.id;S.view='project';S.tab=el.dataset.tab||'overview';render()},
  setTab:(el)=>{S.tab=el.dataset.tab;render()},
  setStage:(el)=>{project(el.dataset.id).stage=el.dataset.stage;render()},
  addScene:(el)=>{const p=project(el.dataset.id);const n=p.scenes.length+1;
    p.scenes.push({id:'s'+Date.now(),heading:'New scene',desc:'Describe the action…',locId:(p.locationIds[0]||LOCATIONS[0].id)});render()},
  shotLocFilter:(el)=>{S.shotLoc=el.dataset.loc;render()},
  locTypeFilter:(el)=>{S.locType=el.dataset.type;render()},
  roleFilter:(el)=>{S.contactRole=el.dataset.role;render()},
  addCrew:(el)=>{project(el.dataset.id).crew.push(el.dataset.cid);render()},
  sendCallsheet:(el)=>{showToast((el.dataset.via==='email'?'Email':'WhatsApp')+' send needs the backend proxy wired up — see INTEGRATIONS.md')},
  printCallsheet:()=>{window.print()},
  addInvoiceItem:(el)=>{const inv=getInvoice(project(el.dataset.id));
    inv.items.push({id:'ci-'+Date.now(),desc:'New line item',amount:0});render()},
  removeInvoiceItem:(el)=>{const inv=getInvoice(project(el.dataset.id));
    inv.items=inv.items.filter(i=>i.id!==el.dataset.item);render()},
  toggleDeposit:(el)=>{getInvoice(project(el.dataset.id)).depositPaid=el.checked;render()},
  toggleBalance:(el)=>{const inv=getInvoice(project(el.dataset.id));inv.balancePaid=el.checked;
    if(el.checked)inv.status='sent';render()},
  sendInvoice:(el)=>{const inv=getInvoice(project(el.dataset.id));inv.status='sent';render();
    showToast('Invoice marked sent — connect an email relay in the backend proxy to actually deliver it (see INTEGRATIONS.md)')},
  syncQuickbooks:()=>{showToast('Connect a QuickBooks account to sync invoices — needs QuickBooks OAuth wired up in the backend proxy')},
  syncGoogleDocs:()=>{showToast('Auto-creating a synced Google Doc needs Google OAuth wired up in the backend proxy — see INTEGRATIONS.md')},
  toggleAudioPlay:(el)=>{ if(!AUD.el||AUD.projectId!==el.dataset.id)return;
    if(AUD.el.paused)AUD.el.play(); else AUD.el.pause(); },
  seekAudio:(el,ev)=>{ if(!AUD.el||AUD.projectId!==el.dataset.id||!AUD.duration||!ev)return;
    const rect=el.getBoundingClientRect(); const x=ev.clientX-rect.left;
    AUD.el.currentTime=Math.max(0,Math.min(1,x/rect.width))*AUD.duration; updateAudioProgress(); },
  markSplit:(el)=>{ if(!AUD.el||AUD.projectId!==el.dataset.id)return;
    const p=project(el.dataset.id); const sc=p.scenes.find(s=>s.id===el.dataset.scene);
    sc.t=AUD.el.currentTime; render(); },
  openModal:(el)=>{S.modal=el.dataset.modal;render()},
  closeModal:()=>{S.modal=null;render()},
  newProject:()=>{S.modal='project';render()},
  saveLocation:()=>{
    const v=id=>document.getElementById(id).value.trim();
    if(!v('f-name')){showToast('Name is required');return}
    LOCATIONS.push({id:'l'+Date.now(),name:v('f-name'),type:v('f-type'),address:v('f-addr'),notes:v('f-notes')});
    S.modal=null;render();showToast('Location added');
  },
  saveContact:()=>{
    const v=id=>document.getElementById(id).value.trim();
    if(!v('f-name')){showToast('Name is required');return}
    CONTACTS.push({id:'c'+Date.now(),name:v('f-name'),role:v('f-role')||'Crew',rate:v('f-rate')||'—',phone:v('f-phone')||'—',avail:'available'});
    S.modal=null;render();showToast('Person added to directory');
  },
  saveProject:()=>{
    const v=id=>document.getElementById(id).value.trim();
    if(!v('f-name')){showToast('Project name is required');return}
    PROJECTS.push({id:'p'+Date.now(),name:v('f-name'),client:v('f-client')||'—',type:v('f-type'),stage:'inquiry',
      shootDate:v('f-date')||new Date().toISOString().slice(0,10),callTime:'9:00 AM',wrapTime:'5:00 PM',budget:'TBD',
      crew:[],locationIds:[],scenes:[]});
    S.modal=null;render();showToast('Project created');
  },
};
document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')&&e.target.closest('.overlay')&&!e.target.closest('[data-action]'))return;
  const el=e.target.closest('[data-action]'); if(!el)return;
  const fn=ACTIONS[el.dataset.action]; if(fn)fn(el,e);
});
document.addEventListener('pointerdown',e=>{
  const m=e.target.closest('[data-action="dragMarker"]'); if(!m)return;
  e.stopPropagation(); e.preventDefault();
  const wave=document.getElementById('mb-wave'); if(!wave)return;
  const rect=wave.getBoundingClientRect();
  const p=project(m.dataset.id); const sc=p&&p.scenes.find(s=>s.id===m.dataset.scene); if(!sc)return;
  let pct=null;
  const move=ev=>{
    const x=Math.min(rect.width,Math.max(0,ev.clientX-rect.left));
    pct=x/rect.width; m.style.left=(pct*100)+'%';
  };
  const up=()=>{
    document.removeEventListener('pointermove',move);
    document.removeEventListener('pointerup',up);
    if(pct!=null && AUD.duration){ sc.t=pct*AUD.duration; render(); }
  };
  document.addEventListener('pointermove',move);
  document.addEventListener('pointerup',up);
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.action==='liveSearch'){S[el.dataset.field]=el.value;render();
    const box=document.querySelector('[data-field="'+el.dataset.field+'"]'); if(box){box.focus();box.setSelectionRange(box.value.length,box.value.length)}
    return;}
  if(el.dataset.action==='editScene'){
    const p=project(el.dataset.id); const sc=p.scenes.find(s=>s.id===el.dataset.scene);
    sc[el.dataset.field]=el.value;
    if(el.dataset.field==='locId')render();
  }
  if(el.dataset.action==='editInvoiceItem'){
    const inv=getInvoice(project(el.dataset.id)); const it=inv.items.find(i=>i.id===el.dataset.item);
    it[el.dataset.field]=el.dataset.field==='amount'?parseMoney(el.value):el.value;
  }
  if(el.dataset.action==='editNotes'){ project(el.dataset.id).notes=el.value; }
});
document.addEventListener('change',e=>{
  if(e.target.dataset.action==='editInvoiceItem')render();
  if(e.target.dataset.action==='loadAudioFile')handleAudioFile(e.target);
});

/* ── Opener: the logo draws itself on first load each session ─────────────── */
function showOpener(){
  if(sessionStorage.getItem('mb-opener-seen'))return;
  sessionStorage.setItem('mb-opener-seen','1');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const el=document.createElement('div');
  el.className='opener';
  el.innerHTML=`<div class="opener-inner">
    <span class="opener-ring r1"></span><span class="opener-ring r2"></span>
    <span class="opener-mark-wrap"><svg class="opener-mark" viewBox="0 0 400 260">
      <path pathLength="100" d="M 25,225 C 25,150 30,55 45,45 C 60,35 55,110 80,190 C 95,235 100,150 130,60
        C 145,15 165,10 168,60 C 170,110 168,160 168,215 C 168,45 175,35 200,38 C 230,42 232,85 205,100
        C 190,108 175,108 168,108 C 195,110 245,118 248,160 C 251,202 210,222 178,212 C 165,208 160,195 168,185
        C 178,173 200,180 196,200 C 193,214 175,214 170,206"/>
    </svg></span>
    <div class="opener-word"><div class="ow-name">motty berkowitz</div><div class="ow-tag">video production</div></div>
  </div>`;
  document.body.appendChild(el);
  let dismissed=false;
  const dismiss=()=>{
    if(dismissed)return; dismissed=true;
    el.classList.add('lift');
    el.addEventListener('animationend',()=>el.remove(),{once:true});
    setTimeout(()=>el.remove(),1200);
  };
  el.addEventListener('click',dismiss);
  document.addEventListener('keydown',function esc(e){
    if(e.key==='Enter'||e.key==='Escape'){dismiss();document.removeEventListener('keydown',esc);}
  });
  setTimeout(dismiss,3000);
  const freeze=new URLSearchParams(location.search).get('freeze');
  if(freeze!=null){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.getAnimations({subtree:true}).forEach(a=>{a.pause();a.currentTime=Number(freeze);});
    }));
  }
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
showOpener();
render();
</script>
